# Cargo workspace for the real-Rust components of this repo.
#
# `crates/srpc` is the sRPC library being ported from src/rrr (the C++
# implementation, which remains the production code until the crate
# replaces it module-by-module). The crate is the source of truth in
# Rust; the C++ side will consume it through rusty-cpp's Rust->C++
# transpilation (the same pipeline as third-party/rusty-cpp/transpiled/
# {rc,vec,btree,hashbrown}_port), so it must stay transpiler-first:
# zero external dependencies, small isolated unsafe kernels, plain
# control flow.
#
# `exclude`: third-party contains independent cargo projects
# (rusty-cpp, makocon) with their own workspaces/roots — they must not
# be captured by this workspace.
[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["third-party"]
