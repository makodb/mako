[package]
name = "srpc"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]
# verify/ is the Verus harness; it pulls vstd and must never enter the
# production build or the rusty-cpp transpile, so keep it out of the workspace.
# bench/ is the microbenchmark harness, excluded for the same reason in the
# other direction: the source gate runs `cargo test --workspace --all-targets`
# under -Dwarnings, and a benchmark must not add compile time or lint surface
# to a correctness gate.
exclude = ["verify", "bench"]
resolver = "2"

[lib]
path = "src/lib.rs"

[dev-dependencies]
# Property-based testing for the wire codecs (tests only; not linked into the
# library or the generated C++). See docs/testing-plan.md.
proptest = "1"

[lints.rust]
unsafe_code = "deny"
# `verus` is the verification-only cfg set by scripts/verify_srpc.sh; declare
# it so `cargo` under -Dwarnings does not flag `#[cfg(verus)]` as unexpected.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus)'] }
