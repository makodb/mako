[package]
name = "mako-root-build"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[dependencies]

[build-dependencies]
fragile-driver = { git = "https://github.com/shuaimu/fragile.git", branch = "main", package = "fragile-driver" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"

[workspace]
resolver = "2"
members = [
    "cargo-mako-xtask",
    "cargo-mako-native-build",
    "cargo-mako-cmake-bridge",
    "cargo-mako-test-rpc",
]
default-members = [
    ".",
]
exclude = [
    "third-party/fragile",
    "third-party/rusty-cpp",
    "third-party/makocon/makocon",
    # CMake builds this crate directly (via rust-lib symlink); keep it out of
    # the bridge workspace to avoid Cargo workspace-membership errors.
    "third-party/makocon/mako/rust-lib",
    "rust-lib",
]

[workspace.metadata.mako]
bridge_targets = ["cmake-dynamic", "test_rpc"]
