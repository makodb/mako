[workspace]
resolver = "2"
members = [
    "cargo-mako-xtask",
    "cargo-mako-native-build",
    "cargo-mako-cmake-bridge",
    "cargo-mako-test-rpc",
]
default-members = [
    "cargo-mako-cmake-bridge",
]
exclude = [
    "third-party/fragile",
    "third-party/rusty-cpp",
    "third-party/makocon/makocon",
    # CMake builds this crate directly (via rust-lib symlink); keep it out of
    # the bridge workspace to avoid Cargo workspace-membership errors.
    "third-party/makocon/mako/rust-lib",
    "rust-lib",
]

[workspace.metadata.mako]
bridge_targets = ["cmake-dynamic", "test_rpc"]
