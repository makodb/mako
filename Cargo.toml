[package]
name = "mako-root-build"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[dependencies]

[workspace]
resolver = "2"
default-members = [
    ".",
]
exclude = [
    "third-party/fragile",
    "third-party/rusty-cpp",
    "third-party/makocon/makocon",
    # CMake builds this crate directly (via rust-lib symlink); keep it out of
    # the bridge workspace to avoid Cargo workspace-membership errors.
    "third-party/makocon/mako/rust-lib",
    "rust-lib",
]
