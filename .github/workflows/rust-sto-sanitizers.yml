name: Rust STO native sanitizers

on:
  push:
    branches: [mako-dev, mako-weihai]
    paths:
      - ".gitmodules"
      - ".github/workflows/rust-sto-sanitizers.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "config/**"
      - "crates/**"
      - "install_rustc.sh"
      - "rust-toolchain.toml"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "third-party/**"
  pull_request:
    branches: [mako-dev, mako-weihai]
    paths:
      - ".gitmodules"
      - ".github/workflows/rust-sto-sanitizers.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "config/**"
      - "crates/**"
      - "install_rustc.sh"
      - "rust-toolchain.toml"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "third-party/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  native-sanitizer:
    name: ${{ matrix.sanitizer }} Rust/native boundary
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/makodb/mako-ci-ubuntu24@sha256:3bf4d101ad119672560a28c0c7eb5fbf5e36c1695437382f8393aa5e26644628
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined, thread]
    env:
      CMAKE_GENERATOR: Ninja
      MAKO_SANITIZER_JOBS: "4"
      CARGO_HOME: /tmp/rust-sto-sanitizer-cargo
      RUSTUP_HOME: /tmp/rust-sto-sanitizer-rustup
      # Read by the thread leg only, and by its cache steps. It must stay
      # outside the workspace: the gate refuses a worktree it would dirty.
      MAKO_SANITIZER_ROCKSDB_DIR: /tmp/rust-sto-sanitizer-rocksdb
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      # Every lane builds `mako`, whose srpc source gate runs ripgrep; the
      # pinned image predates apt_packages.sh installing it.
      - name: Container prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then
              command -v sudo >/dev/null 2>&1 || { echo "ripgrep missing and not root (uid $(id -u)), no sudo" >&2; exit 1; }
              SUDO="sudo"
            fi
            $SUDO apt-get update -qq
            DEBIAN_FRONTEND=noninteractive $SUDO apt-get install -y -qq ripgrep
          fi
          rg --version | head -1

      # Stable must be the release mainline's native sharding crate requires
      # (src/cluster/Cargo.toml rust-version = 1.97.1); `mako` links it.
      - name: Install Rust workspace toolchain
        if: matrix.sanitizer == 'undefined'
        shell: bash
        run: |
          set -euo pipefail
          if command -v rustc >/dev/null 2>&1 &&
             command -v cargo >/dev/null 2>&1; then
            if rust_version="$(rustc --version 2>/dev/null | awk '{print $2}')" &&
               rust_sysroot="$(rustc --print sysroot 2>/dev/null)" &&
               [ "${rust_version}" = "1.97.1" ] &&
               [ -r "${rust_sysroot}/lib/rustlib/src/rust/library/core/src/marker.rs" ] &&
               cargo clippy --version >/dev/null 2>&1; then
              exit 0
            fi
          fi
          bash ./install_rustc.sh
          echo "${HOME}/.local-rust/bin" >>"${GITHUB_PATH}"

      - name: Install pinned Rust sanitizer toolchain
        if: matrix.sanitizer != 'undefined'
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(bash scripts/ci/run_rust_sto_sanitizer.sh --print-nightly-toolchain)"
          bash ./scripts/ci/install_pinned_rustup.sh
          # mako-local-sys's build script runs bindgen, which formats its
          # output with the rustfmt of the active (RUSTUP_TOOLCHAIN) toolchain.
          "${CARGO_HOME}/bin/rustup" toolchain install "${toolchain}" \
            --profile minimal --component clippy --component rustfmt \
            --component rust-src
          # The Raft and native-sharding archives that reach dbtest are built
          # with the selected sanitizer toolchain, against the one
          # instrumented std the gate builds from its rust-src, like every
          # other Cargo archive and test executable of the job
          # (MAKO_CARGO_EXECUTABLE, MAKO_RUST_STO_RUSTUP_TOOLCHAIN and
          # MAKO_RUST_STO_SYSROOT in CMakeLists.txt). Mainline's
          # other Cargo edges, SRPC's crate mode and the source gates, go
          # through the rustup proxy and so use the workspace-default
          # toolchain (rust-toolchain.toml). Install that one once here so
          # parallel build edges cannot race to auto-install it in the shared
          # RUSTUP_HOME.
          workspace_toolchain="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "${workspace_toolchain}"
          "${CARGO_HOME}/bin/rustup" toolchain install "${workspace_toolchain}" \
            --profile minimal --component clippy --component rustfmt \
            --component rust-src
          echo "${CARGO_HOME}/bin" >>"${GITHUB_PATH}"

      # The thread gate links and loads a RocksDB rebuilt with
      # -fsanitize=thread (scripts/ci/build_tsan_rocksdb.sh). The key is that
      # script's own identity: pinned commit and version, CMake flags,
      # compiler banner, machine and the script's hash, so any edit to the
      # script changes the key. The script, here and again inside the gate
      # with the compiler CMake selects, reuses the directory only when its
      # stamp and the library's hash match, the library carries the
      # sanitizer hooks and its own dependencies resolve; otherwise it
      # rebuilds. The cache is saved before the gate runs, so a red gate
      # keeps it. An entry that restores but cannot be reused is rebuilt by
      # every run and never replaced (a key is written once): the build step
      # warns, and `gh cache delete <key>` clears the entry.
      - name: Instrumented RocksDB cache key
        id: tsan-rocksdb
        if: matrix.sanitizer == 'thread'
        shell: bash
        run: |
          set -euo pipefail
          # Assigned first: errexit does not see a substitution inside an
          # echo argument, and an empty key would fail one step later.
          key="$(bash scripts/ci/build_tsan_rocksdb.sh --print-cache-key)"
          if [[ ! "${key}" =~ ^mako-tsan-rocksdb-[0-9.]+-[0-9a-f]{64}$ ]]; then
            echo "unexpected instrumented RocksDB cache key: ${key}" >&2
            exit 1
          fi
          echo "key=${key}" >>"${GITHUB_OUTPUT}"

      - name: Restore instrumented RocksDB
        id: tsan-rocksdb-cache
        if: matrix.sanitizer == 'thread'
        timeout-minutes: 10
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.MAKO_SANITIZER_ROCKSDB_DIR }}
          key: ${{ steps.tsan-rocksdb.outputs.key }}

      - name: Build or validate instrumented RocksDB
        if: matrix.sanitizer == 'thread'
        timeout-minutes: 30
        shell: bash
        env:
          TSAN_ROCKSDB_CACHE_HIT: ${{ steps.tsan-rocksdb-cache.outputs.cache-hit }}
          TSAN_ROCKSDB_CACHE_KEY: ${{ steps.tsan-rocksdb.outputs.key }}
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP:-/tmp}/tsan-rocksdb-facts.txt"
          bash scripts/ci/build_tsan_rocksdb.sh \
            --prefix "${MAKO_SANITIZER_ROCKSDB_DIR}" \
            --jobs "${MAKO_SANITIZER_JOBS}" \
            --report "${report}"
          if [[ "${TSAN_ROCKSDB_CACHE_HIT}" == "true" ]] &&
             grep -Fxq 'tsan_rocksdb_provenance=built' "${report}"; then
            echo "::warning::The instrumented RocksDB cache entry ${TSAN_ROCKSDB_CACHE_KEY} was restored but could not be reused, so the library was rebuilt and will be rebuilt by every run. Clear it with: gh cache delete ${TSAN_ROCKSDB_CACHE_KEY}"
          fi

      - name: Save instrumented RocksDB
        if: matrix.sanitizer == 'thread' && steps.tsan-rocksdb-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.MAKO_SANITIZER_ROCKSDB_DIR }}
          key: ${{ steps.tsan-rocksdb.outputs.key }}

      - name: Run ${{ matrix.sanitizer }} gate
        shell: bash
        run: bash scripts/ci/run_rust_sto_sanitizer.sh "${{ matrix.sanitizer }}"

      - name: Upload sanitizer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-sto-${{ matrix.sanitizer }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            build-rust-sto-*/rust-sto-sanitizer-manifest.txt
            build-rust-sto-*/sanitizer-logs/**
