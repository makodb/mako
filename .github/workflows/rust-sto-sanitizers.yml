name: Rust STO native sanitizers

on:
  push:
    branches: [mako-dev, mako-weihai]
    paths:
      - ".gitmodules"
      - ".github/workflows/rust-sto-sanitizers.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "config/**"
      - "crates/**"
      - "install_rustc.sh"
      - "rust-toolchain.toml"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "third-party/**"
  pull_request:
    branches: [mako-dev, mako-weihai]
    paths:
      - ".gitmodules"
      - ".github/workflows/rust-sto-sanitizers.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "config/**"
      - "crates/**"
      - "install_rustc.sh"
      - "rust-toolchain.toml"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "third-party/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  native-sanitizer:
    name: ${{ matrix.sanitizer }} Rust/native boundary
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/makodb/mako-ci-ubuntu24@sha256:3bf4d101ad119672560a28c0c7eb5fbf5e36c1695437382f8393aa5e26644628
      # TSan may re-exec with ADDR_NO_RANDOMIZE on high-entropy ASLR hosts.
      options: --security-opt seccomp=unconfined
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined, thread]
    env:
      CMAKE_GENERATOR: Ninja
      MAKO_SANITIZER_JOBS: "4"
      CARGO_HOME: /tmp/rust-sto-sanitizer-cargo
      RUSTUP_HOME: /tmp/rust-sto-sanitizer-rustup
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      # The pinned image predates the source-audit ripgrep dependency.
      - name: Container prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then
              command -v sudo >/dev/null 2>&1 || { echo "ripgrep missing and not root (uid $(id -u)), no sudo" >&2; exit 1; }
              SUDO="sudo"
            fi
            $SUDO apt-get update -qq
            DEBIAN_FRONTEND=noninteractive $SUDO apt-get install -y -qq ripgrep
          fi
          rg --version | head -1

      # Stable must be the release mainline's native sharding crate requires
      # (src/cluster/Cargo.toml rust-version = 1.97.1).
      - name: Install Rust workspace toolchain
        if: matrix.sanitizer == 'undefined'
        shell: bash
        run: |
          set -euo pipefail
          if command -v rustc >/dev/null 2>&1 &&
             command -v cargo >/dev/null 2>&1; then
            if rust_version="$(rustc --version 2>/dev/null | awk '{print $2}')" &&
               rust_sysroot="$(rustc --print sysroot 2>/dev/null)" &&
               [ "${rust_version}" = "1.97.1" ] &&
               [ -r "${rust_sysroot}/lib/rustlib/src/rust/library/core/src/marker.rs" ] &&
               cargo clippy --version >/dev/null 2>&1; then
              exit 0
            fi
          fi
          bash ./install_rustc.sh
          echo "${HOME}/.local-rust/bin" >>"${GITHUB_PATH}"

      - name: Install pinned Rust sanitizer toolchain
        if: matrix.sanitizer != 'undefined'
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(bash scripts/ci/run_rust_sto_sanitizer.sh --print-nightly-toolchain)"
          bash ./scripts/ci/install_pinned_rustup.sh
          "${CARGO_HOME}/bin/rustup" toolchain install "${toolchain}" \
            --profile minimal --component clippy --component rustfmt \
            --component rust-src
          # All target crates, including Raft and native SRPC, use one
          # instrumented std. Install the workspace pin for host-side tooling.
          workspace_toolchain="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "${workspace_toolchain}"
          "${CARGO_HOME}/bin/rustup" toolchain install "${workspace_toolchain}" \
            --profile minimal --component clippy --component rustfmt \
            --component rust-src
          echo "${CARGO_HOME}/bin" >>"${GITHUB_PATH}"

      - name: Run ${{ matrix.sanitizer }} gate
        shell: bash
        run: bash scripts/ci/run_rust_sto_sanitizer.sh "${{ matrix.sanitizer }}"

      - name: Upload sanitizer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-sto-${{ matrix.sanitizer }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            build-rust-sto-*/rust-sto-sanitizer-manifest.txt
            build-rust-sto-*/sanitizer-logs/**
            build-rust-sto-*/tsan-rocksdb/instrumentation.json
            build-rust-sto-*/tsan-rocksdb/library.sha256
            build-rust-sto-*/tsan-rocksdb/build/compile_commands.json
            build-rust-sto-*/tsan-rocksdb/build/CMakeCache.txt
