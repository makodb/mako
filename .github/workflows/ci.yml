name: CI

on:
  push:
    branches: [ mako-dev, mako-weihai ]
  pull_request:
    branches: [ mako-dev, mako-weihai ]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  rocksdb-raft:
    name: Native Rust STO + RocksDB + Raft
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/makodb/mako-ci-ubuntu24:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 90
    env:
      CI_BUILD_JOBS: "4"
      ROCKSDB_RAFT_BUILD_DIR: build_rocksdb_raft
      CARGO_TARGET_DIR: target-rocksdb-raft
    steps:
      # srpc needs its Lion submodule. Fetch it with the checkout action, as
      # every other job here does, not with a later `git submodule update`
      # step: bare git refuses this container's runner-owned checkout (see
      # "Container prerequisites" in build-and-test).
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Install pinned Rust toolchain
        run: bash scripts/ci/install_rust_toolchain.sh 1.97.1 /opt/rust
      - name: Build and qualify local-only storage and replication
        run: bash ci/rocksdb_raft.sh
      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rocksdb-raft-tests
          path: |
            build_rocksdb_raft/Testing/Temporary/
            build_rocksdb_raft/runtime-evidence.*/**/node*.log
            build_rocksdb_raft/runtime-evidence.*/**/*.json

  native-rust:
    name: Native Rust application and separate storage gates
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/makodb/mako-ci-ubuntu24:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 180
    env:
      BUILD_DIR: build
      CI_MAKE_JOBS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Install pinned Rust toolchain
        run: bash scripts/ci/install_rust_toolchain.sh 1.97.1 /opt/rust
      - name: Install Rust workspace components
        shell: bash
        run: |
          set -euo pipefail
          rust_version=1.97.1
          [ "$(rustc --version | awk '{print $2}')" = "${rust_version}" ]
          rust_sysroot="$(rustc --print sysroot)"
          marker="${rust_sysroot}/lib/rustlib/src/rust/library/core/src/marker.rs"
          stamp="${rust_sysroot}/lib/rustlib/src/mako-rust-src-version"
          if [ ! -r "${marker}" ] \
              || [ "$(cat "${stamp}" 2>/dev/null || true)" != "${rust_version}" ]; then
            work="$(mktemp -d)"
            archive="rust-src-${rust_version}.tar.gz"
            curl --proto '=https' --tlsv1.2 -fL --retry 3 \
              --output "${work}/${archive}" \
              "https://static.rust-lang.org/dist/${archive}"
            curl --proto '=https' --tlsv1.2 -fL --retry 3 \
              --output "${work}/${archive}.sha256" \
              "https://static.rust-lang.org/dist/${archive}.sha256"
            (cd "${work}" && sha256sum --check --strict "${archive}.sha256")
            tar -xzf "${work}/${archive}" -C "${work}"
            "${work}/rust-src-${rust_version}/install.sh" --prefix="${rust_sysroot}"
            printf '%s\n' "${rust_version}" > "${stamp}"
            rm -rf "${work}"
          fi
          test -r "${marker}"
          [ "$(cat "${stamp}")" = "${rust_version}" ]
          cargo clippy --version
          cargo fmt --version

      - name: Build optimized native executables
        run: bash ci/native_rust.sh compile
      - name: Transaction manager, Masstree and adapter components
        run: bash ci/native_rust.sh components
      - name: Separate C++ storage component tests
        run: bash ci/native_rust.sh storage
      - name: Native poison transition and Rust API checks
        run: bash ci/native_rust.sh health && bash ci/native_rust.sh quality
      - name: Runtime and process regression suites in debug and release
        run: bash ci/native_rust.sh runtime
      - name: Separate and colocated workload matrix
        run: bash ci/native_rust.sh workloads
      - name: Audit native sources, headers, Rust archives and executable links
        run: bash ci/native_rust.sh audit
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-rust-tests
          path: |
            build/Testing/Temporary/
            build/runs/
            build/rust-cache-tests.json
            build/native-dependency-audit/
            build/native-health-*/
            build/storage-tests/Testing/Temporary/

  native-srpc:
    name: Native SRPC without C++ tools or providers
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/makodb/mako-ci-ubuntu24:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Install pinned Rust toolchain
        run: bash scripts/ci/install_rust_toolchain.sh 1.97.1 /opt/rust
      - name: Test copied Rust, Lion and C kernel tree with CXX disabled
        run: bash ci/native_rust.sh srpc

  native-proofs:
    name: Native sharding and storage host proofs
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/makodb/mako-ci-ubuntu24:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Install pinned Rust toolchain
        run: bash scripts/ci/install_rust_toolchain.sh 1.97.1 /opt/rust
      - name: Verify production modules, independent models and negative controls
        run: bash ci/native_rust.sh proofs

  rust-sto-miri:
    name: Rust STO Miri ownership gate
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/makodb/mako-ci-ubuntu24@sha256:3bf4d101ad119672560a28c0c7eb5fbf5e36c1695437382f8393aa5e26644628
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 360
    env:
      CARGO_HOME: /tmp/rust-sto-miri-cargo
      CARGO_TARGET_DIR: /tmp/rust-sto-miri-target
      RUSTUP_HOME: /tmp/rust-sto-miri-rustup
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install pinned Miri toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain=$(bash ./scripts/run_rust_sto_miri.sh --print-toolchain)
          bash ./scripts/ci/install_pinned_rustup.sh
          "${CARGO_HOME}/bin/rustup" toolchain install "${toolchain}" \
            --profile minimal --component miri --component rust-src
          echo "${CARGO_HOME}/bin" >> "${GITHUB_PATH}"

      - name: Run Rust STO ownership tests under Miri
        run: bash ./scripts/run_rust_sto_miri.sh
