  mako-local-miri:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/makodb/mako-ci-ubuntu24:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    env:
      CARGO_HOME: /tmp/mako-local-miri-cargo
      CARGO_TARGET_DIR: /tmp/mako-local-miri-target
      RUSTUP_HOME: /tmp/mako-local-miri-rustup
    steps:
      - name: Checkout
