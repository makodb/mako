name: CI

on:
  push:
    branches: [ mako-dev, mako-weihai ]
  pull_request:
    branches: [ mako-dev, mako-weihai ]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# comment out so we run test for every commit, otherwise new commit will cancel old (pending test) commit.
#concurrency:
#  group: ${{ github.workflow }}-${{ github.ref }}
#  cancel-in-progress: false

jobs:
  rrr-goal0-dual-compile:
    name: Goal-0 RRR canonical Rust dual compile
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/makodb/mako-ci-ubuntu24:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 90
    env:
      CMAKE_GENERATOR: "Ninja"
      CI_MAKE_JOBS: "4"
      GOAL0_BUILD_DIR: build-goal0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure canonical Rust providers
        run: >-
          cmake -S . -B "${GOAL0_BUILD_DIR}" -G "${CMAKE_GENERATOR}"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      # The consumer targets below are mako's own tests that link the
      # production `rrr` archive -- which, per src/rrr/CMakeLists.txt, is built
      # from exactly the thirty-seven generated canonical-Rust providers. They
      # replace the nineteen `src/rrr/tests/` binaries this step used to name:
      # those are srpc's tests, mako stopped building them in 4a06ef0e, and
      # ninja has been failing here with `unknown target 'test_timer'` ever
      # since. Chosen because they exercise the canonical modules (rpc,
      # transport, marshal, timers, threading) without dragging in the
      # cluster/mako/masstree/txlog stack, keeping this focused job fast.
      - name: Build production, generated-object lane, and dual gate
        run: >-
          cmake --build "${GOAL0_BUILD_DIR}"
          --parallel "${CI_MAKE_JOBS}"
          --target rrr_goal0_dual_compile test_client_service test_arc_mutex_thread test_txn_timeout test_raft_messages test_raft_quorum test_raft_channel_transport test_raft_transport_facade test_raft_dispatcher_facade test_raft_memory_snapshot_manager test_raft_test_cluster test_raft_rrr_transport_compile
          -- -k 0

      - name: Verify Raft inline Rust DSL provenance
        shell: bash
        run: |
          set -euo pipefail
          transpiler="$(cat "${GOAL0_BUILD_DIR}/src/rrr/goal0-transpiler-executable.txt")"
          test -x "${transpiler}"
          "${transpiler}" --build-info
          bash scripts/raft_dsl.sh --check --transpiler "${transpiler}"

      - name: Verify emitter and canonical Rust invalidate crate generation
        shell: bash
        run: |
          set -euo pipefail
          # Only inputs are needed now: the outputs are identified by the
          # basenames the generator reports, not by path+mtime.
          emitter_input="$(sed -n '1p' "${GOAL0_BUILD_DIR}/src/rrr/goal0-transpiler-input.txt")"
          # Canonical Rust lives at its layout-mirroring path (base/misc/reactor/
          # rpc), not a flat src/. Only lib.rs remains under src/.
          canonical_input="src/rrr/rpc/frame_codec.rs"
          runtime_facade_input="src/rrr/rusty-rustc/src/lib.rs"
          type_map_input="src/rrr/rust-type-map.toml"
          module_index_input="src/rrr/cpp-module-index.toml"

          # `touch` CREATES a missing path instead of failing, so a stale name
          # here would silently plant a stray file in the crate and make the
          # NEXT build die with no output (set -e aborts inside the command
          # substitution, before its printf). Fail loudly and early instead.
          for probe_input in "${emitter_input}" "${canonical_input}" \
            "${runtime_facade_input}" "${type_map_input}" "${module_index_input}"; do
            if [ ! -e "${probe_input}" ]; then
              echo "invalidation input does not exist: ${probe_input}" >&2
              exit 1
            fi
          done

          steady_output="$(cmake --build "${GOAL0_BUILD_DIR}" --target rrr_goal0_crate_codegen -- -k 0 2>&1)"
          printf '%s\n' "${steady_output}"
          if grep -Fq 'Generating Goal-0 rrr crate C++ child modules' <<<"${steady_output}"; then
            echo 'crate generation reran without an emitter or source change' >&2
            exit 1
          fi

          # The sub-checks below assert on what the generator REPORTS, not on
          # output mtimes. The emitters deliberately skip writing
          # byte-identical output, so a touched input legitimately regenerates
          # without bumping any mtime -- the old `stat -c %Y ... -gt` assertions
          # were measuring "was rewritten" instead of "was regenerated and
          # re-confirmed", and failed in CI on a correct build. See
          # scripts/ci/assert_crate_codegen.sh for the full reasoning; it is a
          # script (not inline) so the assertion logic is unit-tested, including
          # that it still FAILS when regeneration does not happen.
          # Via `bash` deliberately: core.fileMode=false in this repo means a
          # chmod +x can be silently dropped from the index, so do not depend
          # on the exec bit (it is set, but this makes it not matter).
          assert_regenerated=(bash scripts/ci/assert_crate_codegen.sh)

          touch "${emitter_input}"
          changed_output="$(cmake --build "${GOAL0_BUILD_DIR}" --target rrr_goal0_crate_codegen -- -k 0 2>&1)"
          printf '%s\n' "${changed_output}"

          # The invariant here is mako's build graph: touching an emitter input
          # must invalidate the codegen edge and re-emit every module. That is
          # exactly what assert_regenerated checks. Do not also assert that cargo
          # printed "Compiling" — cargo decides freshness by fingerprint, so a
          # touched-but-unchanged source can legitimately produce no rebuild, and
          # asserting on that mechanism made this step fail for the wrong reason.
          "${assert_regenerated[@]}" rrr.frame_codec.cppm <<<"${changed_output}"

          touch "${canonical_input}"
          canonical_output="$(cmake --build "${GOAL0_BUILD_DIR}" --target rrr_goal0_crate_codegen -- -k 0 2>&1)"
          printf '%s\n' "${canonical_output}"

          "${assert_regenerated[@]}" rrr.frame_codec.cppm <<<"${canonical_output}"

          touch "${runtime_facade_input}"
          facade_output="$(cmake --build "${GOAL0_BUILD_DIR}" --target rrr_goal0_crate_codegen -- -k 0 2>&1)"
          printf '%s\n' "${facade_output}"

          "${assert_regenerated[@]}" \
            rrr.request_queue.cppm \
            rrr.load_balancer.cppm \
            rrr.utils.cppm \
            rrr.frame_codec.cppm \
            <<<"${facade_output}"
          test ! -e "${GOAL0_BUILD_DIR}/src/rrr/goal0-crate-cpp/rusty"

          for sidecar_input in "${type_map_input}" "${module_index_input}"; do
            touch "${sidecar_input}"
            sidecar_output="$(cmake --build "${GOAL0_BUILD_DIR}" --target rrr_goal0_crate_codegen -- -k 0 2>&1)"
            printf '%s\n' "${sidecar_output}"

            "${assert_regenerated[@]}" rrr.utils.cppm rrr.frame_codec.cppm \
              <<<"${sidecar_output}"
          done

      # --no-tests=error is load-bearing, not decoration: plain `ctest -R` exits
      # 0 when the pattern matches nothing, so a stale name list here would go
      # green having run zero tests. Keep this list and the --target list above
      # in step.
      - name: Run focused production consumers
        run: >-
          ctest --test-dir "${GOAL0_BUILD_DIR}"
          --output-on-failure
          --no-tests=error
          -R '^(test_client_service|test_arc_mutex_thread|test_txn_timeout|test_raft_messages|test_raft_quorum|test_raft_channel_transport|test_raft_transport_facade|test_raft_dispatcher_facade|test_raft_memory_snapshot_manager|test_raft_test_cluster|test_raft_rrr_transport_compile)$'

  build-and-test:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/makodb/mako-ci-ubuntu24:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # --sysctl: keep kernel-assigned ephemeral source ports away from every
      # band the test harness listens on. The suite's fixed/randomized listen
      # ports (static paxos 45xxx + ctrl 55xxx, static raft ctrl 37xxx, raw
      # dbtest configs up to 35100, randomized paxos/raft 40000..64535) sit
      # inside Linux's default ephemeral range (32768-60999); an outbound
      # connect() can grab one as its source port (or self-connect to it),
      # and the later listener bind() dies with EADDRINUSE even under
      # SO_REUSEADDR — the dominant mako-dev CI flake. Reserved ports are
      # still bindable explicitly; the allocator just skips them. Ephemeral
      # pool left: 35101-36999 + 37401-39999 (~4.5k ports, loopback
      # tcp_tw_reuse keeps that plenty). NOTE: value must stay space-free —
      # the runner splits `options` on whitespace.
      options: --user root --sysctl net.ipv4.ip_local_reserved_ports=32768-35100,37000-37400,40000-64999
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        build_type: [Release]
        run_number: [1]
    env:
      RUN_INDEX: ${{ matrix.run_number }}     # 1, 2, or 3 (per matrix job)
      RUN_NUM: ${{ github.run_number }}       # monotonically increasing per workflow
      RUN_ID: ${{ github.run_id }}            # unique per workflow run
      MAKO_NO_GDB: "1"                        # Disable GDB for CI (breaks output parsing)
      CI_MAKE_JOBS: "4"                       # Keep compile CPU usage low on shared runners
      CMAKE_GENERATOR: "Ninja"                # Force CMake to generate Ninja build files
      MAKO_CPU_LIMIT: "5"                     # CPU throttling for dbtest workers
      MAKO_THROTTLE_CYCLE_MS: "100"           # Throttle duty-cycle period (ms)
      MAKO_MAX_WAIT_SECONDS: "180"            # Allow slower throttled runs to finish
      MAKO_STARTUP_TIMEOUT_SEC: "300"          # dbtest replicated-startup watchdog (peers may take >120s on CI under throttling)
      MAKO_CI_TRD: "3"                        # warehouses/threads per shard — shrunk from 6 to fit the GitHub-hosted 7GB runner under 8-process Raft replication
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive  # if you use submodules (e.g., third-party libs)

      - name: Environments
        run: |
          pwd
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          echo "RUNNER_TOOL_CACHE=$RUNNER_TOOL_CACHE"
          echo "RUN_NUMBER=${{ matrix.run_number }}"
          echo "RUN_NUM=${{ github.run_number }}"
          echo "RUN_ID=${{ github.run_id }}"
          echo "CI_MAKE_JOBS=${CI_MAKE_JOBS}"
          echo "CMAKE_GENERATOR=${CMAKE_GENERATOR}"
          echo "MAKO_CPU_LIMIT=${MAKO_CPU_LIMIT}"
          echo "MAKO_THROTTLE_CYCLE_MS=${MAKO_THROTTLE_CYCLE_MS}"
          # Fail loud if the container was created without the reserved-port
          # sysctl (see container.options above): an empty value here means
          # test listen ports are back inside the ephemeral range and the
          # EADDRINUSE flake family is live again.
          echo "ip_local_port_range=$(cat /proc/sys/net/ipv4/ip_local_port_range)"
          echo "ip_local_reserved_ports=$(cat /proc/sys/net/ipv4/ip_local_reserved_ports)"
          grep -q "40000" /proc/sys/net/ipv4/ip_local_reserved_ports
          rustc --version
          cargo --version
          cmake --version
          clang --version

      - name: Compile
        run: ./ci/ci.sh compile

      - name: Run tests - RRR unit tests
        run: ./ci/ci.sh rrrTests

      - name: Run tests - simple transaction
        run: ./ci/ci.sh simpleTransaction

      - name: Run tests - client-server mode
        run: ./ci/ci.sh clientServer

      - name: Run tests - simple replication
        run: ./ci/ci.sh simplePaxos 

      - name: Run tests - simple 2 shards without replication (RRR)
        run: ./ci/ci.sh shardNoReplication

      - name: Run tests - simple 1 shard with replication - dbtest
        run: ./ci/ci.sh shard1Replication

      - name: Run tests - simple 2 shard with replication - dbtest (RRR)
        run: ./ci/ci.sh shard2Replication

      - name: Run tests - simple 1 shard with replication - simpleTransactionRep
        run: ./ci/ci.sh shard1ReplicationSimple
      
      - name: Run tests - simple 2 shard with replication - simpleTransactionRep
        run: ./ci/ci.sh shard2ReplicationSimple

      # =========================================
      # Raft Replication Tests (after Paxos replication tests)
      # =========================================
      - name: Run tests - 1 shard with Raft replication - dbtest
        run: ./ci/ci.sh shard1ReplicationRaft

      - name: Run tests - 2 shard with Raft replication - dbtest
        run: ./ci/ci.sh shard2ReplicationRaft

      - name: Run tests - 1 shard with Raft replication - simpleTransactionRep
        run: ./ci/ci.sh shard1ReplicationSimpleRaft

      - name: Run tests - 2 shard with Raft replication - simpleTransactionRep
        run: ./ci/ci.sh shard2ReplicationSimpleRaft

      # =========================================
      # Non-replication tests (run last)
      # =========================================
      - name: Run tests - RocksDB persistence and partitioned queues
        run: ./ci/ci.sh rocksdbTests

      - name: Run tests - multi-shard single process
        run: ./ci/ci.sh multiShardSingleProcess

      - name: Run tests - 2 shard single process (no replication)
        run: ./ci/ci.sh shard2SingleProcess

      - name: Run tests - 2 shard single process with replication
        run: ./ci/ci.sh shard2SingleProcessReplication

      - name: Cleanup
        if: always()
        run: ./ci/ci.sh cleanup
