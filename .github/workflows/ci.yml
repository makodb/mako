name: CI

on:
  push:
    branches: [ mako-dev, mako-weihai ]
  pull_request:
    branches: [ mako-dev, mako-weihai ]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# comment out so we run test for every commit, otherwise new commit will cancel old (pending test) commit.
#concurrency:
#  group: ${{ github.workflow }}-${{ github.ref }}
#  cancel-in-progress: false

jobs:
  srpc-goal0-dual-compile:
    name: Goal-0 SRPC canonical Rust dual compile
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/makodb/mako-ci-ubuntu24@sha256:3bf4d101ad119672560a28c0c7eb5fbf5e36c1695437382f8393aa5e26644628
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 90
    env:
      CMAKE_GENERATOR: "Ninja"
      CI_MAKE_JOBS: "4"
      GOAL0_BUILD_DIR: build-goal0
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install Rust workspace toolchain
        shell: bash
        run: |
          set -euo pipefail
          if command -v rustc >/dev/null 2>&1 &&
             command -v cargo >/dev/null 2>&1 &&
             command -v rustfmt >/dev/null 2>&1; then
            if rust_version="$(rustc --version 2>/dev/null | awk '{print $2}')" &&
               rust_sysroot="$(rustc --print sysroot 2>/dev/null)" &&
               [ "${rust_version}" = "1.95.0" ] &&
               [ -r "${rust_sysroot}/lib/rustlib/src/rust/library/core/src/marker.rs" ] &&
               cargo clippy --version >/dev/null 2>&1; then
              exit 0
            fi
          fi
          bash ./install_rustc.sh
          echo "${HOME}/.local-rust/bin" >> "${GITHUB_PATH}"

      - name: Configure canonical Rust providers
        run: >-
          cmake -S . -B "${GOAL0_BUILD_DIR}" -G "${CMAKE_GENERATOR}"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      # The consumer targets below are mako's own tests that link the
      # production `srpc` archive -- which, per src/srpc-cmake/CMakeLists.txt, is built
      # from exactly the thirty-seven generated canonical-Rust providers. They
      # replace the nineteen `src/srpc/tests/` binaries this step used to name:
      # those are srpc's tests, mako stopped building them in 4a06ef0e, and
      # ninja has been failing here with `unknown target 'test_timer'` ever
      # since. Chosen because they exercise the canonical modules (rpc,
      # transport, marshal, timers, threading) without dragging in the
      # cluster/mako/masstree/txlog stack, keeping this focused job fast.
      - name: Build production, generated-object lane, and dual gate
        run: >-
          cmake --build "${GOAL0_BUILD_DIR}"
          --parallel "${CI_MAKE_JOBS}"
          --target srpc_goal0_dual_compile test_client_service test_arc_mutex_thread test_txn_timeout test_raft_messages test_raft_quorum test_raft_channel_transport test_raft_transport_facade test_raft_dispatcher_facade test_raft_memory_snapshot_manager test_raft_test_cluster test_raft_srpc_transport_compile
          -- -k 0

      - name: Verify emitter and canonical Rust invalidate crate generation
        shell: bash
        run: |
          set -euo pipefail
          # Only inputs are needed now: the outputs are identified by the
          # basenames the generator reports, not by path+mtime.
          emitter_input="$(sed -n '1p' "${GOAL0_BUILD_DIR}/src/srpc/goal0-transpiler-input.txt")"
          # Canonical Rust lives at its layout-mirroring path (base/misc/reactor/
          # rpc), not a flat src/. Only lib.rs remains under src/.
          canonical_input="src/srpc/rpc/frame_codec.rs"
          runtime_facade_input="src/srpc/rusty-rustc/src/lib.rs"
          type_map_input="src/srpc/rust-type-map.toml"
          module_index_input="src/srpc/cpp-module-index.toml"

          # `touch` CREATES a missing path instead of failing, so a stale name
          # here would silently plant a stray file in the crate and make the
          # NEXT build die with no output (set -e aborts inside the command
          # substitution, before its printf). Fail loudly and early instead.
          for probe_input in "${emitter_input}" "${canonical_input}" \
            "${runtime_facade_input}" "${type_map_input}" "${module_index_input}"; do
            if [ ! -e "${probe_input}" ]; then
              echo "invalidation input does not exist: ${probe_input}" >&2
              exit 1
            fi
          done

          steady_output="$(cmake --build "${GOAL0_BUILD_DIR}" --target srpc_goal0_crate_codegen -- -k 0 2>&1)"
          printf '%s\n' "${steady_output}"
          if grep -Fq 'Generating Goal-0 srpc crate C++ child modules' <<<"${steady_output}"; then
            echo 'crate generation reran without an emitter or source change' >&2
            exit 1
          fi

          # The sub-checks below assert on what the generator REPORTS, not on
          # output mtimes. The emitters deliberately skip writing
          # byte-identical output, so a touched input legitimately regenerates
          # without bumping any mtime -- the old `stat -c %Y ... -gt` assertions
          # were measuring "was rewritten" instead of "was regenerated and
          # re-confirmed", and failed in CI on a correct build. See
          # scripts/ci/assert_crate_codegen.sh for the full reasoning; it is a
          # script (not inline) so the assertion logic is unit-tested, including
          # that it still FAILS when regeneration does not happen.
          # Via `bash` deliberately: core.fileMode=false in this repo means a
          # chmod +x can be silently dropped from the index, so do not depend
          # on the exec bit (it is set, but this makes it not matter).
          assert_regenerated=(bash scripts/ci/assert_crate_codegen.sh)

          touch "${emitter_input}"
          changed_output="$(cmake --build "${GOAL0_BUILD_DIR}" --target srpc_goal0_crate_codegen -- -k 0 2>&1)"
          printf '%s\n' "${changed_output}"

          # The invariant here is mako's build graph: touching an emitter input
          # must invalidate the codegen edge and re-emit every module. That is
          # exactly what assert_regenerated checks. Do not also assert that cargo
          # printed "Compiling" — cargo decides freshness by fingerprint, so a
          # touched-but-unchanged source can legitimately produce no rebuild, and
          # asserting on that mechanism made this step fail for the wrong reason.
          "${assert_regenerated[@]}" srpc.frame_codec.cppm <<<"${changed_output}"

          touch "${canonical_input}"
          canonical_output="$(cmake --build "${GOAL0_BUILD_DIR}" --target srpc_goal0_crate_codegen -- -k 0 2>&1)"
          printf '%s\n' "${canonical_output}"

          "${assert_regenerated[@]}" srpc.frame_codec.cppm <<<"${canonical_output}"

          touch "${runtime_facade_input}"
          facade_output="$(cmake --build "${GOAL0_BUILD_DIR}" --target srpc_goal0_crate_codegen -- -k 0 2>&1)"
          printf '%s\n' "${facade_output}"

          "${assert_regenerated[@]}" \
            srpc.request_queue.cppm \
            srpc.load_balancer.cppm \
            srpc.utils.cppm \
            srpc.frame_codec.cppm \
            <<<"${facade_output}"
          test ! -e "${GOAL0_BUILD_DIR}/src/srpc/goal0-crate-cpp/rusty"

          for sidecar_input in "${type_map_input}" "${module_index_input}"; do
            touch "${sidecar_input}"
            sidecar_output="$(cmake --build "${GOAL0_BUILD_DIR}" --target srpc_goal0_crate_codegen -- -k 0 2>&1)"
            printf '%s\n' "${sidecar_output}"

            "${assert_regenerated[@]}" srpc.utils.cppm srpc.frame_codec.cppm \
              <<<"${sidecar_output}"
          done

      # --no-tests=error is load-bearing, not decoration: plain `ctest -R` exits
      # 0 when the pattern matches nothing, so a stale name list here would go
      # green having run zero tests. Keep this list and the --target list above
      # in step.
      - name: Run focused production consumers
        run: >-
          ctest --test-dir "${GOAL0_BUILD_DIR}"
          --output-on-failure
          --no-tests=error
          -R '^(test_client_service|test_arc_mutex_thread|test_txn_timeout|test_raft_messages|test_raft_quorum|test_raft_channel_transport|test_raft_transport_facade|test_raft_dispatcher_facade|test_raft_memory_snapshot_manager|test_raft_test_cluster|test_raft_srpc_transport_compile)$'

  build-and-test:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/makodb/mako-ci-ubuntu24@sha256:3bf4d101ad119672560a28c0c7eb5fbf5e36c1695437382f8393aa5e26644628
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # --sysctl: keep kernel-assigned ephemeral source ports away from every
      # band the test harness listens on. The suite's fixed/randomized listen
      # ports (static paxos 45xxx + ctrl 55xxx, static raft ctrl 37xxx, raw
      # dbtest configs up to 35100, randomized paxos/raft 40000..64535) sit
      # inside Linux's default ephemeral range (32768-60999); an outbound
      # connect() can grab one as its source port (or self-connect to it),
      # and the later listener bind() dies with EADDRINUSE even under
      # SO_REUSEADDR — the dominant mako-dev CI flake. Reserved ports are
      # still bindable explicitly; the allocator just skips them. Ephemeral
      # pool left: 35101-36999 + 37401-39999 (~4.5k ports, loopback
      # tcp_tw_reuse keeps that plenty). NOTE: value must stay space-free —
      # the runner splits `options` on whitespace.
      options: --user root --sysctl net.ipv4.ip_local_reserved_ports=32768-35100,37000-37400,40000-64999
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        build_type: [Release]
        run_number: [1]
    env:
      RUN_INDEX: ${{ matrix.run_number }}     # 1, 2, or 3 (per matrix job)
      RUN_NUM: ${{ github.run_number }}       # monotonically increasing per workflow
      RUN_ID: ${{ github.run_id }}            # unique per workflow run
      MAKO_NO_GDB: "1"                        # Disable GDB for CI (breaks output parsing)
      CI_MAKE_JOBS: "4"                       # Keep compile CPU usage low on shared runners
      CMAKE_GENERATOR: "Ninja"                # Force CMake to generate Ninja build files
      MAKO_CPU_LIMIT: "5"                     # CPU throttling for dbtest workers
      MAKO_THROTTLE_CYCLE_MS: "100"           # Throttle duty-cycle period (ms)
      MAKO_MAX_WAIT_SECONDS: "180"            # Allow slower throttled runs to finish
      MAKO_STARTUP_TIMEOUT_SEC: "300"          # dbtest replicated-startup watchdog (peers may take >120s on CI under throttling)
      MAKO_CI_TRD: "3"                        # warehouses/threads per shard — shrunk from 6 to fit the GitHub-hosted 7GB runner under 8-process Raft replication
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive  # if you use submodules (e.g., third-party libs)

      # The current published image predates the Rust STO workspace MSRV.
      # The compile-fail snapshots also need rust-src so standard-library spans
      # render identically under rustup and the standalone CI toolchain.
      - name: Install Rust workspace toolchain
        shell: bash
        run: |
          set -euo pipefail
          if command -v rustc >/dev/null 2>&1 &&
             command -v cargo >/dev/null 2>&1 &&
             command -v rustfmt >/dev/null 2>&1; then
            if rust_version="$(rustc --version 2>/dev/null | awk '{print $2}')" &&
               rust_sysroot="$(rustc --print sysroot 2>/dev/null)" &&
               [ "${rust_version}" = "1.95.0" ] &&
               [ -r "${rust_sysroot}/lib/rustlib/src/rust/library/core/src/marker.rs" ] &&
               cargo clippy --version >/dev/null 2>&1; then
              exit 0
            fi
          fi
          bash ./install_rustc.sh
          echo "${HOME}/.local-rust/bin" >> "${GITHUB_PATH}"

      - name: Environments
        run: |
          pwd
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          echo "RUNNER_TOOL_CACHE=$RUNNER_TOOL_CACHE"
          echo "RUN_NUMBER=${{ matrix.run_number }}"
          echo "RUN_NUM=${{ github.run_number }}"
          echo "RUN_ID=${{ github.run_id }}"
          echo "CI_MAKE_JOBS=${CI_MAKE_JOBS}"
          echo "CMAKE_GENERATOR=${CMAKE_GENERATOR}"
          echo "MAKO_CPU_LIMIT=${MAKO_CPU_LIMIT}"
          echo "MAKO_THROTTLE_CYCLE_MS=${MAKO_THROTTLE_CYCLE_MS}"
          # Fail loud if the container was created without the reserved-port
          # sysctl (see container.options above): an empty value here means
          # test listen ports are back inside the ephemeral range and the
          # EADDRINUSE flake family is live again.
          echo "ip_local_port_range=$(cat /proc/sys/net/ipv4/ip_local_port_range)"
          echo "ip_local_reserved_ports=$(cat /proc/sys/net/ipv4/ip_local_reserved_ports)"
          grep -q "40000" /proc/sys/net/ipv4/ip_local_reserved_ports
          rustc --version
          cargo --version
          cmake --version
          clang --version

      - name: Check Rust workspace formatting
        run: cargo fmt --manifest-path crates/Cargo.toml --all -- --check

      - name: Compile
        run: ./ci/ci.sh compile

      - name: Build Rust STO and Masstree integration
        run: >-
          cmake --build build
          --parallel "${CI_MAKE_JOBS}"
          --target rust_sto_integration test_silo_runtime
          -- -k 0

      - name: Verify Rust STO boundary test inventory
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build --show-only=json-v1 \
            > build/rust-sto-ctest-inventory.json
          python3 - <<'PY'
          import json
          import shlex
          from pathlib import Path

          required = {
              "SiloVarintTests",
              "test_mako_value_metadata",
              "test_mtree_abi",
              "test_mtree_abi_c11_header",
              "test_rocksdb_interface_lifecycle",
              "test_silo_nontxn_api",
              "test_silo_nontxn_api_mv_delete_delete_conflict",
              "test_silo_nontxn_api_mv_delete_update_conflict",
              "test_silo_runtime_concurrency_lifecycle",
              "test_silo_transaction_install_exception_fail_stop",
              "test_silo_transaction_set_capacity_exhaustion",
              "test_silo_transaction_set_exact_chunk_boundary",
              "test_silo_transitem_lifetime",
              "test_srpc_epoll_platform",
              "test_sto_tpcc_ffi_c11_header",
              "test_sto_tpcc_cpp_wrapper_smoke",
              "test_sto_tpcc_cpp_wrapper_scan_smoke",
              "test_sto_tpcc_cpp_slow_exit",
              "test_sto_tpcc_cpp_multishard_slow_exit",
              "test_sto_tpcc_rust_slow_exit",
              "test_sto_tpcc_rust_concurrent",
              "test_sto_tpcc_rejects_duplicate_local_shards",
              "test_sto_tpcc_rejects_partial_local_shards",
              "test_sto_tpcc_rejects_rust_distributed_shard",
              "test_sto_tpcc_rejects_rust_replication",
              "test_sto_tpcc_rejects_rust_worker_limit",
          }
          inventory = json.loads(
              Path("build/rust-sto-ctest-inventory.json").read_text())
          tests = inventory.get("tests", [])
          counts = {}
          by_name = {}
          rust_names = set()
          for test in tests:
              name = test.get("name")
              counts[name] = counts.get(name, 0) + 1
              by_name[name] = test
              for prop in test.get("properties", []):
                  if (prop.get("name") == "LABELS"
                          and "rust" in prop.get("value", [])):
                      rust_names.add(name)

          missing = sorted(required - set(by_name))
          if missing:
              raise SystemExit(
                  "missing Rust STO boundary CTests: " + ", ".join(missing))
          unexpected_rust = sorted(rust_names - required)
          if unexpected_rust:
              raise SystemExit(
                  "Rust-labeled CTests are not in the explicit hosted gate: "
                  + ", ".join(unexpected_rust))
          duplicates = sorted(
              name for name in required if counts.get(name) != 1)
          if duplicates:
              raise SystemExit(
                  "Rust STO boundary CTests are not registered exactly once: "
                  + ", ".join(duplicates))

          forbidden_properties = {
              "DISABLED",
              "PASS_REGULAR_EXPRESSION",
              "SKIP_REGULAR_EXPRESSION",
              "SKIP_RETURN_CODE",
              "WILL_FAIL",
          }
          allowed_environment = {
              "test_sto_tpcc_cpp_multishard_slow_exit": [
                  "MAKO_TPCC_WORKLOAD_MIX=0,0,34,33,33"
              ],
          }
          exact_filters = {
              "test_silo_runtime_concurrency_lifecycle": (
                  "--gtest_filter=SiloRuntimeTest.ConcurrentGlobalDefaultInitialization:"
                  "SiloRuntimeLifetimeTest.LazyServicesHaveBoundedTeardown:"
                  "CoreStorageTest.*:SpinBarrierTest.*:MasstreeContextEpochTest.*:"
                  "MassTransEpochIntegrationTest.*:StoThreadIdLifecycleTest.*:"
                  "StoEpochAdvancerLifecycleTest.*:MakoTimestampTest.*"
              ),
              "test_silo_transitem_lifetime": (
                  "--gtest_filter=TransItemLifetimeTest."
                  "ReusedSlotRetainsExactlyOneOwnedExtraString"
              ),
              "test_silo_transaction_set_exact_chunk_boundary": (
                  "--gtest_filter=TransactionSetBoundaryTest."
                  "ParticipantAbortCleansExactChunkBoundaries"
              ),
              "test_silo_transaction_set_capacity_exhaustion": (
                  "--gtest_filter=TransactionSetBoundaryTest."
                  "CapacityExhaustionFailsClosedInRelease"
              ),
              "test_silo_transaction_install_exception_fail_stop": (
                  "--gtest_filter=TransactionCommitFailureTest."
                  "InstallExceptionIsFailStop"
              ),
              "test_silo_nontxn_api_mv_delete_delete_conflict": (
                  "--gtest_filter=SiloNonTxnApi."
                  "ConcurrentMvDeletesOfPresentRowConflict"
              ),
              "test_silo_nontxn_api_mv_delete_update_conflict": (
                  "--gtest_filter=SiloNonTxnApi."
                  "ConcurrentMvDeleteInvalidatesStagedUpdate"
              ),
          }
          fail_if_empty_gtests = set(exact_filters) | {
              "SiloVarintTests",
              "test_mako_value_metadata",
              "test_mtree_abi",
              "test_silo_nontxn_api",
              "test_srpc_epoll_platform",
          }
          for name in sorted(required):
              test = by_name[name]
              command = test.get("command", [])
              if not command:
                  raise SystemExit(
                      f"Rust STO boundary CTest has no command: {name}")
              properties = {
                  prop.get("name"): prop.get("value")
                  for prop in test.get("properties", [])
              }
              forbidden = sorted(forbidden_properties & set(properties))
              if forbidden:
                  raise SystemExit(
                      f"Rust STO boundary CTest {name} has coverage-altering "
                      "properties: " + ", ".join(forbidden))
              if "ENVIRONMENT_MODIFICATION" in properties:
                  raise SystemExit(
                      f"Rust STO boundary CTest {name} modifies its environment")
              environment = properties.get("ENVIRONMENT", [])
              if environment != allowed_environment.get(name, []):
                  raise SystemExit(
                      f"Rust STO boundary CTest {name} has unexpected "
                      f"environment: {environment!r}")
              expected_filter = exact_filters.get(name)
              if expected_filter is not None:
                  if command.count(expected_filter) != 1:
                      raise SystemExit(
                          f"Rust STO boundary CTest {name} lost its exact "
                          f"GTest selector: {command!r}")
              if name in fail_if_empty_gtests:
                  if command.count("--gtest_fail_if_no_test_selected") != 1:
                      raise SystemExit(
                          f"Rust STO boundary CTest {name} lost its "
                          f"fail-if-empty guard: {command!r}")
          database = json.loads(Path("build/compile_commands.json").read_text())
          root = Path.cwd().resolve()
          for relative in (
              "src/mako/sto/MassTrans.cc",
              "tests/test_silo_nontxn_api.cc",
          ):
              source = (root / relative).resolve()
              matches = [
                  entry for entry in database
                  if Path(entry["file"]).resolve() == source
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"expected one compile command for {relative}, "
                      f"found {len(matches)}")
              entry = matches[0]
              tokens = entry.get("arguments") or shlex.split(entry["command"])
              definitions = [
                  token for token in tokens
                  if token.startswith("-DREAD_MY_WRITES=")
              ]
              if definitions != ["-DREAD_MY_WRITES=0"]:
                  raise SystemExit(
                      f"{relative} has inconsistent default READ_MY_WRITES "
                      f"definitions: {definitions!r}")
          print(
              f"verified {len(required)} exact Rust STO boundary CTests "
              "with READ_MY_WRITES=0")
          PY

      # The aggregate target above builds every boundary regression named
      # here. Keep the selector explicit so a rename or lost registration
      # fails CI rather than silently reducing coverage.
      - name: Run Rust STO C and C++ boundary tests
        run: >-
          ctest --test-dir build
          --output-on-failure
          --no-tests=error
          -R '^(SiloVarintTests|test_mako_value_metadata|test_mtree_abi|test_mtree_abi_c11_header|test_rocksdb_interface_lifecycle|test_silo_nontxn_api|test_silo_nontxn_api_mv_delete_delete_conflict|test_silo_nontxn_api_mv_delete_update_conflict|test_silo_runtime_concurrency_lifecycle|test_silo_transaction_install_exception_fail_stop|test_silo_transaction_set_capacity_exhaustion|test_silo_transaction_set_exact_chunk_boundary|test_silo_transitem_lifetime|test_srpc_epoll_platform|test_sto_tpcc_ffi_c11_header|test_sto_tpcc_cpp_wrapper_smoke|test_sto_tpcc_cpp_wrapper_scan_smoke|test_sto_tpcc_cpp_slow_exit|test_sto_tpcc_cpp_multishard_slow_exit|test_sto_tpcc_rust_slow_exit|test_sto_tpcc_rust_concurrent|test_sto_tpcc_rejects_duplicate_local_shards|test_sto_tpcc_rejects_partial_local_shards|test_sto_tpcc_rejects_rust_distributed_shard|test_sto_tpcc_rejects_rust_replication|test_sto_tpcc_rejects_rust_worker_limit)$'

      - name: Run Rust STO workspace tests in release mode
        run: >-
          cargo test
          --manifest-path crates/Cargo.toml
          --workspace
          --exclude sto-tpcc-ffi
          --all-targets
          --all-features
          --release
          --locked
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/rust-workspace-target

      - name: Build Rust STO workspace documentation
        run: >-
          cargo doc
          --manifest-path crates/Cargo.toml
          --workspace
          --all-features
          --locked
          --no-deps
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/rust-workspace-target
          RUSTDOCFLAGS: -D warnings

      - name: Run tests - SRPC unit tests
        run: ./ci/ci.sh srpcTests

      - name: Run tests - simple transaction
        run: ./ci/ci.sh simpleTransaction

      - name: Run tests - client-server mode
        run: ./ci/ci.sh clientServer

      - name: Run tests - simple replication
        run: ./ci/ci.sh simplePaxos 

      - name: Run tests - simple 2 shards without replication (SRPC)
        run: ./ci/ci.sh shardNoReplication

      - name: Run tests - simple 1 shard with replication - dbtest
        run: ./ci/ci.sh shard1Replication

      - name: Run tests - simple 2 shard with replication - dbtest (SRPC)
        run: ./ci/ci.sh shard2Replication

      - name: Run tests - simple 1 shard with replication - simpleTransactionRep
        run: ./ci/ci.sh shard1ReplicationSimple
      
      - name: Run tests - simple 2 shard with replication - simpleTransactionRep
        run: ./ci/ci.sh shard2ReplicationSimple

      # =========================================
      # Raft Replication Tests (after Paxos replication tests)
      # =========================================
      - name: Run tests - 1 shard with Raft replication - dbtest
        run: ./ci/ci.sh shard1ReplicationRaft

      - name: Run tests - 2 shard with Raft replication - dbtest
        run: ./ci/ci.sh shard2ReplicationRaft

      - name: Run tests - 1 shard with Raft replication - simpleTransactionRep
        run: ./ci/ci.sh shard1ReplicationSimpleRaft

      - name: Run tests - 2 shard with Raft replication - simpleTransactionRep
        run: ./ci/ci.sh shard2ReplicationSimpleRaft

      # =========================================
      # Non-replication tests (run last)
      # =========================================
      - name: Run tests - RocksDB persistence and partitioned queues
        run: ./ci/ci.sh rocksdbTests

      - name: Run tests - multi-shard single process
        run: ./ci/ci.sh multiShardSingleProcess

      - name: Run tests - 2 shard single process (no replication)
        run: ./ci/ci.sh shard2SingleProcess

      - name: Run tests - 2 shard single process with replication
        run: ./ci/ci.sh shard2SingleProcessReplication

      # Run this profile last: changing READ_MY_WRITES requires a consistent
      # rebuild of libmako and its test consumer, and must not alter the
      # default-profile binaries used by the broader suite above.
      - name: Run STO read-my-writes MV regressions
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G "${CMAKE_GENERATOR}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DSTO_RMW=ON
          grep -Fxq 'CMAKE_BUILD_TYPE:STRING=Release' build/CMakeCache.txt
          grep -Fxq 'STO_RMW:BOOL=ON' build/CMakeCache.txt
          cmake --build build \
            --parallel "${CI_MAKE_JOBS}" \
            --target test_silo_nontxn_api -- -k 0
          python3 - <<'PY'
          import json
          import shlex
          from pathlib import Path

          database = json.loads(Path("build/compile_commands.json").read_text())
          required = (
              "src/mako/sto/MassTrans.cc",
              "tests/test_silo_nontxn_api.cc",
          )
          root = Path.cwd().resolve()
          for relative in required:
              source = (root / relative).resolve()
              matches = [
                  entry for entry in database
                  if Path(entry["file"]).resolve() == source
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"expected one compile command for {relative}, found {len(matches)}")
              entry = matches[0]
              tokens = entry.get("arguments") or shlex.split(entry["command"])
              definitions = [
                  token for token in tokens
                  if token.startswith("-DREAD_MY_WRITES=")
              ]
              if definitions != ["-DREAD_MY_WRITES=1"]:
                  raise SystemExit(
                      f"{relative} has inconsistent READ_MY_WRITES definitions: "
                      f"{definitions!r}")
          print("verified Release STO_RMW profile: READ_MY_WRITES=1")
          PY
          ctest --test-dir build --show-only=json-v1 \
            > build/rust-sto-rmw-ctest-inventory.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          tests = json.loads(
              Path("build/rust-sto-rmw-ctest-inventory.json").read_text()
          ).get("tests", [])
          expected = {
              "test_silo_nontxn_api_sto_rmw_insert_delete": (
                  "--gtest_filter=SiloNonTxnApi."
                  "MassTransInsertThenDeleteCancelsInMvMode"
              ),
              "test_silo_nontxn_api_sto_rmw_resurrection_delete": (
                  "--gtest_filter=SiloNonTxnApi."
                  "MassTransResurrectionThenDeleteIsNetZeroInMvMode"
              ),
          }
          forbidden_properties = {
              "DISABLED",
              "ENVIRONMENT",
              "ENVIRONMENT_MODIFICATION",
              "PASS_REGULAR_EXPRESSION",
              "SKIP_REGULAR_EXPRESSION",
              "SKIP_RETURN_CODE",
              "WILL_FAIL",
          }
          for name, expected_filter in expected.items():
              matches = [test for test in tests if test.get("name") == name]
              if len(matches) != 1:
                  raise SystemExit(
                      f"STO_RMW CTest {name} must be registered exactly once; "
                      f"found {len(matches)}")
              test = matches[0]
              command = test.get("command", [])
              if not command:
                  raise SystemExit(f"STO_RMW CTest has no command: {name}")
              if command.count(expected_filter) != 1:
                  raise SystemExit(
                      f"STO_RMW CTest {name} lost its exact GTest selector: "
                      f"{command!r}")
              if command.count("--gtest_fail_if_no_test_selected") != 1:
                  raise SystemExit(
                      f"STO_RMW CTest {name} lost its fail-if-empty guard")
              properties = {
                  prop.get("name"): prop.get("value")
                  for prop in test.get("properties", [])
              }
              forbidden = sorted(forbidden_properties & set(properties))
              if forbidden:
                  raise SystemExit(
                      f"STO_RMW CTest {name} has coverage-altering "
                      "properties: " + ", ".join(forbidden))
              if "sto-rmw" not in properties.get("LABELS", []):
                  raise SystemExit(
                      f"STO_RMW CTest {name} lost its exact sto-rmw label")
          print("verified exact STO_RMW CTest inventory and commands")
          PY
          for test_name in \
            test_silo_nontxn_api_sto_rmw_insert_delete \
            test_silo_nontxn_api_sto_rmw_resurrection_delete; do
            ctest --test-dir build \
              --output-on-failure \
              --no-tests=error \
              -R "^${test_name}$"
          done

      - name: Cleanup
        if: always()
        run: ./ci/ci.sh cleanup

  rust-sto-miri:
    name: Rust STO Miri ownership gate
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/makodb/mako-ci-ubuntu24@sha256:3bf4d101ad119672560a28c0c7eb5fbf5e36c1695437382f8393aa5e26644628
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 360
    env:
      CARGO_HOME: /tmp/rust-sto-miri-cargo
      CARGO_TARGET_DIR: /tmp/rust-sto-miri-target
      RUSTUP_HOME: /tmp/rust-sto-miri-rustup
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install pinned Miri toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain=$(bash ./scripts/run_rust_sto_miri.sh --print-toolchain)
          bash ./scripts/ci/install_pinned_rustup.sh
          "${CARGO_HOME}/bin/rustup" toolchain install "${toolchain}" \
            --profile minimal --component miri --component rust-src
          echo "${CARGO_HOME}/bin" >> "${GITHUB_PATH}"

      - name: Run Rust STO ownership tests under Miri
        run: bash ./scripts/run_rust_sto_miri.sh
