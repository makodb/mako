name: CI

on:
  push:
    branches: [ mako-dev, mako-weihai ]
  pull_request:
    branches: [ mako-dev, mako-weihai ]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# comment out so we run test for every commit, otherwise new commit will cancel old (pending test) commit.
#concurrency:
#  group: ${{ github.workflow }}-${{ github.ref }}
#  cancel-in-progress: false

jobs:
  rocksdb-raft:
    name: Native Rust STO + RocksDB + Raft
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/makodb/mako-ci-ubuntu24:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 90
    env:
      CI_BUILD_JOBS: "4"
      ROCKSDB_RAFT_BUILD_DIR: build_rocksdb_raft
      CARGO_TARGET_DIR: target-rocksdb-raft
    steps:
      # srpc needs its Lion submodule. Fetch it with the checkout action, as
      # every other job here does, not with a later `git submodule update`
      # step: bare git refuses this container's runner-owned checkout (see
      # "Container prerequisites" in build-and-test).
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Install pinned Rust toolchain
        run: bash scripts/ci/install_rust_toolchain.sh 1.97.1 /opt/rust
      - name: Build and qualify local-only storage and replication
        run: bash ci/rocksdb_raft.sh
      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rocksdb-raft-tests
          path: |
            build_rocksdb_raft/Testing/Temporary/
            build_rocksdb_raft/runtime-evidence.*/**/node*.log
            build_rocksdb_raft/runtime-evidence.*/**/*.json

  srpc-goal0-dual-compile:
    name: Goal-0 SRPC canonical Rust dual compile
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/makodb/mako-ci-ubuntu24@sha256:3bf4d101ad119672560a28c0c7eb5fbf5e36c1695437382f8393aa5e26644628
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 90
    env:
      CMAKE_GENERATOR: "Ninja"
      CI_MAKE_JOBS: "4"
      GOAL0_BUILD_DIR: build-goal0
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      # The source gates run ripgrep (src/srpc/scripts/srpc_dsl_check.sh).
      # apt_packages.sh installs it, but this job pulls a published CI image,
      # which is only rebuilt after a push to mako-dev, so install it here
      # if the image predates that. Do NOT mark the checkout safe for git
      # globally here: the gates vouch for exactly the directories they read
      # (ownership_exception() in scripts/extract_srpc_rust.py, owned_git in
      # scripts/raft_dsl.sh), and test_bare_git_really_is_refused asserts
      # that bare git still refuses a foreign-owned checkout.
      - name: Container prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then
              command -v sudo >/dev/null 2>&1 || { echo "ripgrep missing and not root (uid $(id -u)), no sudo" >&2; exit 1; }
              SUDO="sudo"
            fi
            $SUDO apt-get update -qq
            DEBIAN_FRONTEND=noninteractive $SUDO apt-get install -y -qq ripgrep
          fi
          rg --version | head -1

      # PRs consume the last published image, not this checkout's Dockerfile.
      # Provision the exact official toolchain required by native sharding/Verus.
      - name: Install pinned Rust toolchain
        run: bash scripts/ci/install_rust_toolchain.sh 1.97.1 /opt/rust

      - name: Configure canonical Rust providers
        run: >-
          cmake -S . -B "${GOAL0_BUILD_DIR}" -G "${CMAKE_GENERATOR}"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      # The consumer targets below are mako's own tests that link the
      # production `srpc` archive -- which, per src/srpc-cmake/CMakeLists.txt, is built
      # from exactly the thirty-seven generated canonical-Rust providers. They
      # replace the nineteen `src/srpc/tests/` binaries this step used to name:
      # those are srpc's tests, mako stopped building them in 4a06ef0e, and
      # ninja has been failing here with `unknown target 'test_timer'` ever
      # since. Chosen because they exercise the canonical modules (rpc,
      # transport, marshal, timers, threading) without dragging in the
      # cluster/mako/masstree/txlog stack, keeping this focused job fast.
      - name: Build production, generated-object lane, and dual gate
        run: >-
          cmake --build "${GOAL0_BUILD_DIR}"
          --parallel "${CI_MAKE_JOBS}"
          --target srpc_goal0_dual_compile test_client_service test_arc_mutex_thread test_txn_timeout test_srpc_timeout_race
          -- -k 0

      - name: Verify Raft inline Rust DSL provenance
        shell: bash
        run: |
          set -euo pipefail
          transpiler="$(cat "${GOAL0_BUILD_DIR}/src/srpc/goal0-transpiler-executable.txt")"
          test -x "${transpiler}"
          "${transpiler}" --build-info
          bash scripts/raft_dsl.sh --check --transpiler "${transpiler}"

      - name: Verify emitter and canonical Rust invalidate crate generation
        shell: bash
        run: |
          set -euo pipefail
          # Only inputs are needed now: the outputs are identified by the
          # basenames the generator reports, not by path+mtime.
          emitter_input="$(sed -n '1p' "${GOAL0_BUILD_DIR}/src/srpc/goal0-transpiler-input.txt")"
          # Canonical Rust lives at its layout-mirroring path (base/misc/reactor/
          # rpc), not a flat src/. Only lib.rs remains under src/.
          canonical_input="src/srpc/rpc/frame_codec.rs"
          crate_manifest_input="src/srpc/Cargo.toml"
          type_map_input="src/srpc/rust-type-map.toml"
          module_index_input="src/srpc/cpp-module-index.toml"

          # `touch` CREATES a missing path instead of failing, so a stale name
          # here would silently plant a stray file in the crate and make the
          # NEXT build die with no output (set -e aborts inside the command
          # substitution, before its printf). Fail loudly and early instead.
          for probe_input in "${emitter_input}" "${canonical_input}" \
            "${crate_manifest_input}" "${type_map_input}" "${module_index_input}"; do
            if [ ! -e "${probe_input}" ]; then
              echo "invalidation input does not exist: ${probe_input}" >&2
              exit 1
            fi
          done

          # Each build below prints its captured output before failing: under
          # `set -e` a failing command substitution would otherwise exit
          # with the output still in the variable, and the log shows nothing.
          steady_output="$(cmake --build "${GOAL0_BUILD_DIR}" --target srpc_goal0_crate_codegen -- -k 0 2>&1)" \
            || { printf '%s\n' "${steady_output}"; exit 1; }
          printf '%s\n' "${steady_output}"
          if grep -Fq 'Generating Goal-0 srpc crate C++ child modules' <<<"${steady_output}"; then
            echo 'crate generation reran without an emitter or source change' >&2
            exit 1
          fi

          # The sub-checks below assert on what the generator REPORTS, not on
          # output mtimes. The emitters deliberately skip writing
          # byte-identical output, so a touched input legitimately regenerates
          # without bumping any mtime -- the old `stat -c %Y ... -gt` assertions
          # were measuring "was rewritten" instead of "was regenerated and
          # re-confirmed", and failed in CI on a correct build. See
          # scripts/ci/assert_crate_codegen.sh for the full reasoning; it is a
          # script (not inline) so the assertion logic is unit-tested, including
          # that it still FAILS when regeneration does not happen.
          # Via `bash` deliberately: core.fileMode=false in this repo means a
          # chmod +x can be silently dropped from the index, so do not depend
          # on the exec bit (it is set, but this makes it not matter).
          assert_regenerated=(bash scripts/ci/assert_crate_codegen.sh)

          touch "${emitter_input}"
          changed_output="$(cmake --build "${GOAL0_BUILD_DIR}" --target srpc_goal0_crate_codegen -- -k 0 2>&1)" \
            || { printf '%s\n' "${changed_output}"; exit 1; }
          printf '%s\n' "${changed_output}"

          # The invariant here is mako's build graph: touching an emitter input
          # must invalidate the codegen edge and re-emit every module. That is
          # exactly what assert_regenerated checks. Do not also assert that cargo
          # printed "Compiling" — cargo decides freshness by fingerprint, so a
          # touched-but-unchanged source can legitimately produce no rebuild, and
          # asserting on that mechanism made this step fail for the wrong reason.
          "${assert_regenerated[@]}" srpc.frame_codec.cppm <<<"${changed_output}"

          touch "${canonical_input}"
          canonical_output="$(cmake --build "${GOAL0_BUILD_DIR}" --target srpc_goal0_crate_codegen -- -k 0 2>&1)" \
            || { printf '%s\n' "${canonical_output}"; exit 1; }
          printf '%s\n' "${canonical_output}"

          "${assert_regenerated[@]}" srpc.frame_codec.cppm <<<"${canonical_output}"

          touch "${crate_manifest_input}"
          manifest_output="$(cmake --build "${GOAL0_BUILD_DIR}" --target srpc_goal0_crate_codegen -- -k 0 2>&1)" \
            || { printf '%s\n' "${manifest_output}"; exit 1; }
          printf '%s\n' "${manifest_output}"

          "${assert_regenerated[@]}" \
            srpc.request_queue.cppm \
            srpc.load_balancer.cppm \
            srpc.utils.cppm \
            srpc.frame_codec.cppm \
            <<<"${manifest_output}"
          test ! -e "${GOAL0_BUILD_DIR}/src/srpc/goal0-crate-cpp/rusty"

          for sidecar_input in "${type_map_input}" "${module_index_input}"; do
            touch "${sidecar_input}"
            sidecar_output="$(cmake --build "${GOAL0_BUILD_DIR}" --target srpc_goal0_crate_codegen -- -k 0 2>&1)" \
              || { printf '%s\n' "${sidecar_output}"; exit 1; }
            printf '%s\n' "${sidecar_output}"

            "${assert_regenerated[@]}" srpc.utils.cppm srpc.frame_codec.cppm \
              <<<"${sidecar_output}"
          done

      # --no-tests=error is load-bearing, not decoration: plain `ctest -R` exits
      # 0 when the pattern matches nothing, so a stale name list here would go
      # green having run zero tests. Keep this list and the --target list above
      # in step.
      - name: Run focused production consumers
        run: >-
          ctest --test-dir "${GOAL0_BUILD_DIR}"
          --output-on-failure
          --no-tests=error
          -R '^(test_client_service|test_arc_mutex_thread|test_txn_timeout|test_srpc_timeout_race)$'

  build-and-test:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/makodb/mako-ci-ubuntu24@sha256:3bf4d101ad119672560a28c0c7eb5fbf5e36c1695437382f8393aa5e26644628
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # --sysctl: keep kernel-assigned ephemeral source ports away from every
      # band the test harness listens on. The suite's fixed/randomized listen
      # ports (static paxos 45xxx + ctrl 55xxx, static raft ctrl 37xxx, raw
      # dbtest configs up to 35100, randomized paxos/raft 40000..64535) sit
      # inside Linux's default ephemeral range (32768-60999); an outbound
      # connect() can grab one as its source port (or self-connect to it),
      # and the later listener bind() dies with EADDRINUSE even under
      # SO_REUSEADDR — the dominant mako-dev CI flake. Reserved ports are
      # still bindable explicitly; the allocator just skips them. Ephemeral
      # pool left: 35101-36999 + 37401-39999 (~4.5k ports, loopback
      # tcp_tw_reuse keeps that plenty). NOTE: value must stay space-free —
      # the runner splits `options` on whitespace.
      options: --user root --sysctl net.ipv4.ip_local_reserved_ports=32768-35100,37000-37400,40000-64999
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        build_type: [Release]
        run_number: [1]
    env:
      RUN_INDEX: ${{ matrix.run_number }}     # 1, 2, or 3 (per matrix job)
      RUN_NUM: ${{ github.run_number }}       # monotonically increasing per workflow
      RUN_ID: ${{ github.run_id }}            # unique per workflow run
      MAKO_NO_GDB: "1"                        # Disable GDB for CI (breaks output parsing)
      CI_MAKE_JOBS: "4"                       # Keep compile CPU usage low on shared runners
      CMAKE_GENERATOR: "Ninja"                # Force CMake to generate Ninja build files
      MAKO_CPU_LIMIT: "5"                     # CPU throttling for dbtest workers
      MAKO_THROTTLE_CYCLE_MS: "100"           # Throttle duty-cycle period (ms)
      MAKO_MAX_WAIT_SECONDS: "180"            # Allow slower throttled runs to finish
      MAKO_STARTUP_TIMEOUT_SEC: "300"          # dbtest replicated-startup watchdog (peers may take >120s on CI under throttling)
      MAKO_CI_TRD: "3"                        # warehouses/threads per shard — shrunk from 6 to fit the GitHub-hosted 7GB runner under 8-process Raft replication
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive  # if you use submodules (e.g., third-party libs)

      # The source gates run ripgrep (src/srpc/scripts/srpc_dsl_check.sh).
      # apt_packages.sh installs it, but this job pulls a published CI image,
      # which is only rebuilt after a push to mako-dev, so install it here
      # if the image predates that. Do NOT mark the checkout safe for git
      # globally here: the gates vouch for exactly the directories they read
      # (ownership_exception() in scripts/extract_srpc_rust.py, owned_git in
      # scripts/raft_dsl.sh), and test_bare_git_really_is_refused asserts
      # that bare git still refuses a foreign-owned checkout.
      - name: Container prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then
              command -v sudo >/dev/null 2>&1 || { echo "ripgrep missing and not root (uid $(id -u)), no sudo" >&2; exit 1; }
              SUDO="sudo"
            fi
            $SUDO apt-get update -qq
            DEBIAN_FRONTEND=noninteractive $SUDO apt-get install -y -qq ripgrep
          fi
          rg --version | head -1

      # PRs consume the last published image, not this checkout's Dockerfile.
      # Provision the exact official toolchain required by native sharding/Verus;
      # the Rust STO workspace (MSRV 1.95) builds with the same compiler.
      - name: Install pinned Rust toolchain
        run: bash scripts/ci/install_rust_toolchain.sh 1.97.1 /opt/rust

      # The Rust STO compile-fail snapshots need rust-src so standard-library
      # spans render identically under rustup and the standalone CI toolchain,
      # and the workspace gates need clippy and rustfmt. The published image
      # may predate Dockerfile.ubuntu24 installing rust-src, so add it here,
      # verified against the checksum published beside the archive.
      #
      # Presence is not enough: the step above installs the compiler over an
      # existing prefix and replaces only the components it carries, so an
      # image built for another release would keep that release's standard
      # library sources under this compiler. The sources carry no version of
      # their own, so Dockerfile.ubuntu24 and this step record the release
      # they installed in a stamp file and reinstall unless it matches.
      - name: Install Rust workspace components
        shell: bash
        run: |
          set -euo pipefail
          rust_version=1.97.1
          [ "$(rustc --version | awk '{print $2}')" = "${rust_version}" ]
          rust_sysroot="$(rustc --print sysroot)"
          marker="${rust_sysroot}/lib/rustlib/src/rust/library/core/src/marker.rs"
          stamp="${rust_sysroot}/lib/rustlib/src/mako-rust-src-version"
          if [ ! -r "${marker}" ] \
              || [ "$(cat "${stamp}" 2>/dev/null || true)" != "${rust_version}" ]; then
            work="$(mktemp -d)"
            archive="rust-src-${rust_version}.tar.gz"
            curl --proto '=https' --tlsv1.2 -fL --retry 3 \
              --output "${work}/${archive}" \
              "https://static.rust-lang.org/dist/${archive}"
            curl --proto '=https' --tlsv1.2 -fL --retry 3 \
              --output "${work}/${archive}.sha256" \
              "https://static.rust-lang.org/dist/${archive}.sha256"
            (cd "${work}" && sha256sum --check --strict "${archive}.sha256")
            tar -xzf "${work}/${archive}" -C "${work}"
            "${work}/rust-src-${rust_version}/install.sh" --prefix="${rust_sysroot}"
            printf '%s\n' "${rust_version}" > "${stamp}"
            rm -rf "${work}"
          fi
          test -r "${marker}"
          [ "$(cat "${stamp}")" = "${rust_version}" ]
          cargo clippy --version
          cargo fmt --version

      - name: Environments
        run: |
          pwd
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          echo "RUNNER_TOOL_CACHE=$RUNNER_TOOL_CACHE"
          echo "RUN_NUMBER=${{ matrix.run_number }}"
          echo "RUN_NUM=${{ github.run_number }}"
          echo "RUN_ID=${{ github.run_id }}"
          echo "CI_MAKE_JOBS=${CI_MAKE_JOBS}"
          echo "CMAKE_GENERATOR=${CMAKE_GENERATOR}"
          echo "MAKO_CPU_LIMIT=${MAKO_CPU_LIMIT}"
          echo "MAKO_THROTTLE_CYCLE_MS=${MAKO_THROTTLE_CYCLE_MS}"
          # Fail loud if the container was created without the reserved-port
          # sysctl (see container.options above): an empty value here means
          # test listen ports are back inside the ephemeral range and the
          # EADDRINUSE flake family is live again.
          echo "ip_local_port_range=$(cat /proc/sys/net/ipv4/ip_local_port_range)"
          echo "ip_local_reserved_ports=$(cat /proc/sys/net/ipv4/ip_local_reserved_ports)"
          grep -q "40000" /proc/sys/net/ipv4/ip_local_reserved_ports
          rustc --version
          cargo --version
          cmake --version
          clang --version

      - name: Verify native sharding and independent negative controls
        run: ./ci/ci.sh nativeShardingProof

      - name: Compile
        id: compile
        run: ./ci/ci.sh compile

      - name: Run native sharding real-engine migration smoke
        run: ./ci/ci.sh nativeShardingSmoke

      # The CTest sweep in srpcTests also selects the Rust STO C and C++
      # boundary tests, whose binaries are opt-in targets outside `all`. Build
      # just those binaries here, without the Cargo lint and test half of
      # rust_sto_integration, so the sweep does not report them as "Not Run".
      - name: Build Rust STO boundary test binaries
        run: ./ci/ci.sh rustStoBoundaryBinaries

      - name: Run tests - SRPC unit tests
        run: ./ci/ci.sh srpcTests

      - name: Run tests - simple transaction
        run: ./ci/ci.sh simpleTransaction

      - name: Run tests - client-server mode
        run: ./ci/ci.sh clientServer

      - name: Run tests - simple 2 shards without replication (SRPC)
        run: ./ci/ci.sh shardNoReplication

      # =========================================
      # Raft Replication Tests
      # =========================================
      - name: Run tests - 1 shard with Raft replication - dbtest
        run: ./ci/ci.sh shard1ReplicationRaft

      - name: Run tests - 2 shard with Raft replication - dbtest
        run: ./ci/ci.sh shard2ReplicationRaft

      - name: Run tests - 1 shard with Raft replication - simpleTransactionRep
        run: ./ci/ci.sh shard1ReplicationSimpleRaft

      - name: Run tests - 2 shard with Raft replication - simpleTransactionRep
        run: ./ci/ci.sh shard2ReplicationSimpleRaft

      # =========================================
      # Non-replication tests (run last)
      # =========================================
      - name: Run tests - RocksDB persistence and partitioned queues
        run: ./ci/ci.sh rocksdbTests

      - name: Run tests - multi-shard single process
        run: ./ci/ci.sh multiShardSingleProcess

      - name: Run tests - 2 shard single process (no replication)
        run: ./ci/ci.sh shard2SingleProcess

      # =========================================
      # Rust-line gates (after the mainline suites)
      # =========================================
      # A failed step skips every later step that has no `if:`. These gates
      # therefore run after the mainline suites, so a red gate cannot hide the
      # replication matrix, and each carries its own condition, so a red suite
      # or a red sibling gate cannot hide the others. A failing gate still
      # fails the job: none of them is continue-on-error.
      - name: Check Rust workspace formatting
        if: ${{ !cancelled() }}
        # Workspace members only. `--all` would also format every local path
        # dependency, and raft-host and rocksdb-raft-service depend on
        # src/srpc, src/deptran/raft and src/cluster, which are not laid out
        # by rustfmt. Run from the workspace root, plain `cargo fmt` formats
        # exactly the members.
        working-directory: crates
        run: cargo fmt -- --check

      - name: Run tests - Rust storage component and integration gates
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: ./ci/ci.sh rustStorageGates

      - name: Build Rust STO and Masstree integration
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: >-
          cmake --build build
          --parallel "${CI_MAKE_JOBS}"
          --target rust_sto_integration test_silo_runtime
          -- -k 0

      - name: Verify Rust STO boundary test inventory
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build --show-only=json-v1 \
            > build/rust-sto-ctest-inventory.json
          python3 - <<'PY'
          import json
          import shlex
          from pathlib import Path

          required = {
              "SiloVarintTests",
              "test_mako_value_metadata",
              "test_mtree_abi",
              "test_mtree_abi_c11_header",
              "test_rocksdb_interface_lifecycle",
              "test_silo_nontxn_api",
              "test_silo_runtime_concurrency_lifecycle",
              "test_sto_tpcc_ffi_c11_header",
              "test_benchmark_output",
              "test_sto_tpcc_cpp_wrapper_smoke",
              "test_sto_tpcc_cpp_wrapper_scan_smoke",
              "test_sto_tpcc_default_slow_exit",
              "test_sto_tpcc_default_multishard_slow_exit",
              "test_sto_tpcc_rust_slow_exit",
              "test_sto_tpcc_rust_concurrent",
              "test_sto_tpcc_rust_startup_resource_exhausted",
              "test_sto_tpcc_rust_load_resource_exhausted",
              "test_sto_tpcc_rust_run_resource_exhausted",
              "test_sto_tpcc_rust_concurrent_resource_exhausted",
              "test_sto_tpcc_rejects_duplicate_local_shards",
              "test_sto_tpcc_rejects_partial_local_shards",
              # The Rust engine runs distributed and replicated shards now, so
              # the two CTests that expected it to reject them are gone. Its
              # protocol tests carry the rust label instead, and every
              # rust-labeled CTest has to be named here (see below).
              "test_sto_tpcc_protocol_rust_none",
              "test_sto_tpcc_protocol_rust_none_colocated",
              "test_sto_tpcc_protocol_rust_raft",
              "test_sto_tpcc_protocol_rust_raft_colocated",
              "test_sto_tpcc_rejects_rust_worker_limit",
          }
          inventory = json.loads(
              Path("build/rust-sto-ctest-inventory.json").read_text())
          tests = inventory.get("tests", [])
          counts = {}
          by_name = {}
          rust_names = set()
          for test in tests:
              name = test.get("name")
              counts[name] = counts.get(name, 0) + 1
              by_name[name] = test
              for prop in test.get("properties", []):
                  if (prop.get("name") == "LABELS"
                          and "rust" in prop.get("value", [])):
                      rust_names.add(name)

          missing = sorted(required - set(by_name))
          if missing:
              raise SystemExit(
                  "missing Rust STO boundary CTests: " + ", ".join(missing))
          unexpected_rust = sorted(rust_names - required)
          if unexpected_rust:
              raise SystemExit(
                  "Rust-labeled CTests are not in the explicit hosted gate: "
                  + ", ".join(unexpected_rust))
          duplicates = sorted(
              name for name in required if counts.get(name) != 1)
          if duplicates:
              raise SystemExit(
                  "Rust STO boundary CTests are not registered exactly once: "
                  + ", ".join(duplicates))

          forbidden_properties = {
              "DISABLED",
              "PASS_REGULAR_EXPRESSION",
              "SKIP_REGULAR_EXPRESSION",
              "SKIP_RETURN_CODE",
              "WILL_FAIL",
          }
          allowed_environment = {
              "test_sto_tpcc_rust_startup_resource_exhausted": [
                  "MAKO_STO_TPCC_REGISTRY_MEMORY=1"
              ],
              "test_sto_tpcc_rust_load_resource_exhausted": [
                  "MAKO_STO_TPCC_MAX_RETAINED_RECORDS=1"
              ],
              "test_sto_tpcc_rust_run_resource_exhausted": [
                  "MAKO_STO_TPCC_MAX_RETAINED_RECORDS=350000",
                  "MAKO_TPCC_WORKLOAD_MIX=100,0,0,0,0"
              ],
              "test_sto_tpcc_rust_concurrent_resource_exhausted": [
                  "MAKO_STO_TPCC_MAX_RETAINED_RECORDS=350000",
                  "MAKO_TPCC_WORKLOAD_MIX=100,0,0,0,0"
              ],
          }
          exact_filters = {
              "test_silo_runtime_concurrency_lifecycle": (
                  "--gtest_filter=SiloRuntimeTest.ConcurrentGlobalDefaultInitialization:SiloRuntimeLifetimeTest.LazyServicesHaveBoundedTeardown:CoreStorageTest.*:SpinBarrierTest.*:MasstreeContextEpochTest.*:NativeThreadIdTest.*:NativeEpochAdvancerTest.*:NativeEpochGuardTest.*"
              ),
          }
          fail_if_empty_gtests = set(exact_filters) | {
              "SiloVarintTests",
              "test_mako_value_metadata",
              "test_mtree_abi",
              "test_silo_nontxn_api",
          }
          for name in sorted(required):
              test = by_name[name]
              command = test.get("command", [])
              if not command:
                  raise SystemExit(
                      f"Rust STO boundary CTest has no command: {name}")
              properties = {
                  prop.get("name"): prop.get("value")
                  for prop in test.get("properties", [])
              }
              forbidden = sorted(forbidden_properties & set(properties))
              if forbidden:
                  raise SystemExit(
                      f"Rust STO boundary CTest {name} has coverage-altering "
                      "properties: " + ", ".join(forbidden))
              if "ENVIRONMENT_MODIFICATION" in properties:
                  raise SystemExit(
                      f"Rust STO boundary CTest {name} modifies its environment")
              environment = properties.get("ENVIRONMENT", [])
              if environment != allowed_environment.get(name, []):
                  raise SystemExit(
                      f"Rust STO boundary CTest {name} has unexpected "
                      f"environment: {environment!r}")
              expected_filter = exact_filters.get(name)
              if expected_filter is not None:
                  if command.count(expected_filter) != 1:
                      raise SystemExit(
                          f"Rust STO boundary CTest {name} lost its exact "
                          f"GTest selector: {command!r}")
              if name in fail_if_empty_gtests:
                  if command.count("--gtest_fail_if_no_test_selected") != 1:
                      raise SystemExit(
                          f"Rust STO boundary CTest {name} lost its "
                          f"fail-if-empty guard: {command!r}")
          print(f"verified {len(required)} exact Rust boundary CTests")
          PY

      # The aggregate target above builds every boundary regression named
      # here. Keep the selector explicit so a rename or lost registration
      # fails CI rather than silently reducing coverage.
      - name: Run Rust STO C and C++ boundary tests
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: >-
          ctest --test-dir build
          --output-on-failure
          --no-tests=error
          -R '^(SiloVarintTests|test_mako_value_metadata|test_mtree_abi|test_mtree_abi_c11_header|test_rocksdb_interface_lifecycle|test_silo_nontxn_api|test_silo_runtime_concurrency_lifecycle|test_sto_tpcc_ffi_c11_header|test_benchmark_output|test_sto_tpcc_cpp_wrapper_smoke|test_sto_tpcc_cpp_wrapper_scan_smoke|test_sto_tpcc_default_slow_exit|test_sto_tpcc_default_multishard_slow_exit|test_sto_tpcc_rust_slow_exit|test_sto_tpcc_rust_concurrent|test_sto_tpcc_rust_startup_resource_exhausted|test_sto_tpcc_rust_load_resource_exhausted|test_sto_tpcc_rust_run_resource_exhausted|test_sto_tpcc_rust_concurrent_resource_exhausted|test_sto_tpcc_rejects_duplicate_local_shards|test_sto_tpcc_rejects_partial_local_shards|test_sto_tpcc_protocol_rust_none|test_sto_tpcc_protocol_rust_none_colocated|test_sto_tpcc_protocol_rust_raft|test_sto_tpcc_protocol_rust_raft_colocated|test_sto_tpcc_rejects_rust_worker_limit)$'

      - name: Run Rust STO workspace tests in release mode
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        # The release twin of the rust_sto_integration workspace sweep in
        # CMakeLists.txt, with the same two requirements. The cache crates'
        # build scripts take the native archives from MAKO_BUILD_DIR and
        # refuse to guess a build tree. rustStorageGates runs the engine and
        # cache with required native linkage and exact test inventories. The direct RocksDB/Raft crates are tested by their
        # own job (rocksdb-raft, ci/rocksdb_raft.sh), which runs raft-host's
        # scenarios one at a time.
        run: >-
          cargo test
          --manifest-path crates/Cargo.toml
          --workspace
          --exclude sto-tpcc-ffi
          --exclude mako-engine --exclude mako-engine-sto
          --exclude mako-cache --exclude mako-cache-bench
          --exclude sto-rocksdb --exclude raft-host
          --exclude rocksdb-raft-service
          --all-targets
          --all-features
          --release
          --locked
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/rust-workspace-target
          MAKO_BUILD_DIR: ${{ github.workspace }}/build

      - name: Build Rust STO workspace documentation
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        # Same native build tree and the same mutually exclusive backends as
        # the release test sweep above.
        run: >-
          cargo doc
          --manifest-path crates/Cargo.toml
          --workspace
          --exclude mako-engine --exclude mako-engine-sto
          --exclude mako-cache --exclude mako-cache-bench
          --exclude sto-rocksdb --exclude raft-host
          --exclude rocksdb-raft-service
          --all-features
          --locked
          --no-deps
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/rust-workspace-target
          MAKO_BUILD_DIR: ${{ github.workspace }}/build
          RUSTDOCFLAGS: -D warnings

      - name: Check Rust cache persistence across fresh processes
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: cmake --build build --target rust_cache_reopen --parallel "${CI_MAKE_JOBS}"

      - name: Cleanup
        if: always()
        run: ./ci/ci.sh cleanup

  rust-sto-miri:
    name: Rust STO Miri ownership gate
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/makodb/mako-ci-ubuntu24@sha256:3bf4d101ad119672560a28c0c7eb5fbf5e36c1695437382f8393aa5e26644628
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 360
    env:
      CARGO_HOME: /tmp/rust-sto-miri-cargo
      CARGO_TARGET_DIR: /tmp/rust-sto-miri-target
      RUSTUP_HOME: /tmp/rust-sto-miri-rustup
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install pinned Miri toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain=$(bash ./scripts/run_rust_sto_miri.sh --print-toolchain)
          bash ./scripts/ci/install_pinned_rustup.sh
          "${CARGO_HOME}/bin/rustup" toolchain install "${toolchain}" \
            --profile minimal --component miri --component rust-src
          echo "${CARGO_HOME}/bin" >> "${GITHUB_PATH}"

      - name: Run Rust STO ownership tests under Miri
        run: bash ./scripts/run_rust_sto_miri.sh
