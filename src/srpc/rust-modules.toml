# Canonical Rust ownership for modules compiled directly by rustc and
# translated into complete C++ module providers by rusty-cpp crate mode.
schema_version = 2

# Crate-level flat-import namespace: crate mode passes
# --flat-import-namespace srpc, so every private
# `use crate::<child>::<Name leaves>;` item in a canonical source carries an
# implicit cpp_import_namespace(srpc) contract; per-item markers are gone.
flat_import_namespace = "srpc"

[[module]]
cpp_module = "srpc.basetypes"
source = "base/basetypes.rs"

[[module]]
cpp_module = "srpc.callback_wrapper"
source = "base/callback_wrapper.rs"

