# raft: the Raft server around the core (shell/). Two kinds of source, both
# listed in rust-modules.toml. Most are canonical Rust, edited directly:
# server_h.rs, server_cc.rs, disk.rs, the lab suite. The rest are extracted
# from the `#if RUSTYCPP_RUST` blocks of the C++ files named there, whose
# transpiled twins the C++ compiles; rustc checks the Rust here. Regenerate
# those with:
#
#     bash scripts/raft_dsl.sh --rewrite
#
# Deliberately its own workspace root: nothing above src/deptran/raft
# carries a Cargo.toml today, and this must not be absorbed into one
# later without a decision.
[package]
name = "raft"
version = "0.0.0"
edition = "2021"
publish = false

# This crate, the core (core/), the runtime (rt/), the store (store/) and the
# replay (replay/) share one workspace, so one profile block -- panic =
# "abort" below -- governs every artifact, among them libraft_rt.a, the
# archive CMake links (raft-rt, which contains this crate as an rlib).
# A package under this root that was NOT a member would be rejected by cargo,
# and one with its own [workspace] would silently lose panic = "abort".
[workspace]
members = [".", "rt", "core", "replay", "store"]

[lib]
path = "shell/lib.rs"
# Also a static library on its own (libraft.a, not linked): its undefined
# symbols are exactly the raft_* kernels, its defined exports the
# raft_server_* ABI. `nm` on target/release/libraft.a is the check.
crate-type = ["rlib", "staticlib"]

# The same rustc-side facade src/srpc/Cargo.toml:14 depends on. Without it no
# extracted block can NAME a foreign type -- rusty::Mutex, rusty::Option,
# rusty::sync::Arc, rusty::ReactorPollThread, rusty::ReactorIntEvent -- and
# the extracted Rust dies at E0433/E0573 before the emitter is ever consulted.
# The emitter lowers those names correctly today; this is what lets rustc
# agree. See the facade-crate constraint in the Raft migration plan (removed; see git history).
[features]
# The RaftLab correctness harness. CMake turns this on exactly when
# -DRAFT_TEST=ON defines RAFT_TEST_CORO for the C++ side, so the two halves of
# the lab build cannot disagree about whether they are in lab mode.
#
# This is only expressible because server_h.rs / server_cc.rs are canonical
# Rust (F2.6): rustc compiles them directly, so `cfg!` is real. While they
# were DSL blocks a `#[cfg]` was dropped SILENTLY -- scripts/raft_dsl.sh
# rejects one for that reason -- which is why the lab predicate had to be a
# C++ kernel (`raft_lab_mode`) read across the ABI.
raft_test = []
# Raft disk persistence (docs/verus/disk-persistence-plan.md): CMake turns it
# on exactly when -DMAKO_RAFT_DISK=ON. Off, the disk path is compiled but
# never taken (the shell tests `cfg!(feature = "raft_disk")`, a constant).
raft_disk = ["raft-store/rocksdb"]

[dependencies]
# The rustc-side facade. It lives in src/rusty-rustc, NOT inside src/srpc:
# upstream retired its own facade once every srpc module became canonical
# Rust on real std, so this crate is mako's alone -- it models the C++
# types the Raft server holds opaquely. Keeping it inside the vendored
# tree would put it in the path of every subtree pull.
rusty = { path = "../../rusty-rustc" }
# The Raft core that Verus checks (Phase 6): no FFI, no dependencies of its
# own. This crate is its shell.
raft-core = { path = "core" }
# [M0] The replay recorder's format (plan A.4): the writer the shell's
# recorder uses; the replay itself is that crate's test.
raft-replay = { path = "replay" }
# The write-ahead log, its recovery and the flusher (plan P2). Linked in both
# modes, called only in disk builds.
raft-store = { path = "store" }
# NO srpc dependency: everything srpc-facing lives in rt/.

[lints.rust]
unsafe_code = "allow"   # the CRC32 kernel is deliberately unsafe; see its # Safety doc

# Step E of the Raft migration plan (removed; see git history): Rust-authored bodies run on srpc
# fibers and suspend mid-frame. No unwind may cross the fiber's assembly
# context switch, so a panic must abort rather than unwind. This crate is a
# verification view today; under the cutover it is the runtime, and this is
# the one place rustc enforces the constraint.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

# One Verus for the whole Raft build. srpc's runtime is Lion
# (src/srpc/third-party/lion), whose crates take vstd from Verus's git
# repository at rev db81a74 (0.0.0-2025-11-10-1957); raft-core pins Verus's
# crates.io release 0.0.0-2026-08-02-0125 (core/Cargo.toml). raft-rt needs
# both, and Cargo refuses two Verus releases in one graph: each one's
# verus_prettyplease declares `links = "prettyplease-verus02"`. So Lion's vstd
# is replaced by the core's here. Only this workspace sees the patch: srpc's
# own cargo build, test and clippy gates still use Lion's pin. Lion's code is
# unchanged and plain cargo erases its proofs; Lion checks them with its own
# Verus upstream.
[patch."https://github.com/verus-lang/verus"]
vstd = "=0.0.0-2026-08-02-0125"
