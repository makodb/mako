# Native verified core, durable store and replay oracle. Application integration
# lives in crates/raft-host; no C++ host, foreign-type facade or staticlib shell.
[workspace]
resolver = "2"
members = ["core", "store", "replay"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[patch."https://github.com/verus-lang/verus"]
vstd = "=0.0.0-2026-08-02-0125"
