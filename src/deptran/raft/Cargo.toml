# Stage 2 extraction crate for the Raft inline Rust DSL.
#
# The `.rs` files under src/ are GENERATED by concatenating the
# `#if RUSTYCPP_RUST` blocks out of the carriers listed in
# rust-modules.toml. They are NOT hand-authored and NOT the source of
# truth -- the inline blocks are. Regenerate with:
#
#     bash scripts/raft_dsl.sh --rewrite
#
# Production still compiles the committed generated C++ adjacent to each
# block; this crate exists to verify the Rust as a module graph rather
# than as 21 isolated fragments. See docs/stage2_current_progress.txt.
#
# Deliberately its own workspace root: nothing above src/deptran/raft
# carries a Cargo.toml today, and this must not be absorbed into one
# later without a decision.
[package]
name = "raft"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[lints.rust]
unsafe_code = "allow"   # the CRC32 kernel is deliberately unsafe; see its # Safety doc
