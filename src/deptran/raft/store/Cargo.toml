# raft-store: the Rust Raft's on-disk store.
# The write-ahead log (WAL), its crash points, the saved state a
# replay folds, the record queue and the flusher thread.
#
# std only (no `rusty`, no kernel) except the RocksDB base behind the
# `rocksdb` feature, which uses the maintained rocksdb crate; its tests are plain
# `cargo test` either way. The shell (shell/disk.rs) supplies the payload
# codec; everything here is generic over the payload type.
[package]
name = "raft-store"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "raft_store"
path = "src/lib.rs"

[features]
# The native base is optional; pure log tests remain std only.
rocksdb = ["dep:rocksdb"]

[dependencies]
rocksdb = { version = "=0.25.0", optional = true }

[lints.rust]
unsafe_code = "allow"   # crc.rs (SSE4.2 intrinsics), crash.rs (kill(2))
