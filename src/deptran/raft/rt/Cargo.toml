# raft-rt: the Rust lane's runtime for the Raft core (src/deptran/raft).
#
# The core crate (`raft`, one directory up) is Rust source with no runtime of
# its own: it reaches fibers, events, the poll thread and the wire only
# through extern "C" kernels, so that the same source can also be transpiled
# into a C++ lane that runs on the C++ srpc runtime. This crate is the OTHER
# half: those kernels over the Rust srpc crate (src/seam.rs), the transport
# that owns Raft's poll thread, server and peer clients (src/transport.rs),
# the RPC service (src/service.rs), and the generated wire code (src/rpc.rs).
#
# It is a separate crate, not a feature of the core, because the transpiler
# walks every file under a crate's src/ regardless of #[cfg], and refuses a
# crate whose local dependency (srpc) carries source-owned C++ contracts --
# both measured, the two-lane RPC plan (removed; see git history) revision 5.
#
# Built only for -DMAKO_RAFT_LANE=rust, into libraft_rt.a, which then links in
# place of libraft.a (it contains the core as an rlib).
[package]
name = "raft-rt"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "raft_rt"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[features]
# The RaftLab harness, forwarded to the core: CMake turns it on exactly when
# -DRAFT_TEST=ON, as for the core alone.
raft_test = ["raft/raft_test"]
# Disk mode, forwarded to the core's shell: CMake turns it on exactly when
# -DMAKO_RAFT_DISK=ON.
raft_disk = ["raft/raft_disk"]

[dependencies]
raft = { path = ".." }
rusty = { path = "../../../rusty-rustc" }
srpc = { path = "../../../srpc" }

[lints.rust]
unsafe_code = "allow"   # a C ABI and the carriers' raw storage
