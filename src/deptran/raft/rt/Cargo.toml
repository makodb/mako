# raft-rt: the runtime under the Raft shell (src/deptran/raft).
#
# The shell crate (`raft`, one directory up) reaches fibers, events, the poll
# thread and the wire only through extern "C" kernels. This crate defines
# them over the Rust srpc crate (src/seam.rs), with the transport that owns
# Raft's poll thread, server and peer clients (src/transport.rs), the RPC
# service (src/service.rs), the snapshot store (src/snapshot.rs) and the
# generated wire code (src/rpc.rs).
#
# CMake builds it into libraft_rt.a, the archive Mako links; it contains the
# shell and the core as rlibs.
[package]
name = "raft-rt"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "raft_rt"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[features]
# The RaftLab harness, forwarded to the core: CMake turns it on exactly when
# -DRAFT_TEST=ON, as for the core alone.
raft_test = ["raft/raft_test"]
# Disk mode, forwarded to the core's shell: CMake turns it on exactly when
# -DMAKO_RAFT_DISK=ON.
raft_disk = ["raft/raft_disk"]

[dependencies]
raft = { path = ".." }
# Disk mode's timing samples (raft-store::stats), read by the service.
raft-store = { path = "../store" }
rusty = { path = "../../../rusty-rustc" }
srpc = { path = "../../../srpc" }

[lints.rust]
unsafe_code = "allow"   # a C ABI and the carriers' raw storage
