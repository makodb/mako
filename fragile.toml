# Fragile build configuration for Mako project
# This defines how to build Mako using the Fragile compiler

[project]
name = "mako"
version = "0.1.0"

[compiler]
std = "c++20"
# Global includes shared by all targets
includes = [
    ".",
    "src",
    "src/mako",
    "third-party/rusty-cpp/include",
    "third-party/erpc/src",
    "third-party/erpc/src/third-party/asio/include",
]
# Global defines
defines = [
    "CONFIG_H=\"mako/config/config-perf.h\"",
    "NDEBUG",
]

# ============================================================================
# Libraries
# ============================================================================

[[target]]
name = "librrr"
type = "static_library"
sources = [
    "src/rrr/base/basetypes.cpp",
    "src/rrr/base/debugging.cpp",
    "src/rrr/base/logging.cpp",
    "src/rrr/base/misc.cpp",
    "src/rrr/base/strop.cpp",
    "src/rrr/base/threading.cpp",
    "src/rrr/base/unittest.cpp",
    "src/rrr/misc/alock.cpp",
    "src/rrr/misc/marshal.cpp",
    "src/rrr/misc/rand.cpp",
    "src/rrr/misc/recorder.cpp",
    "src/rrr/rpc/client.cpp",
    "src/rrr/rpc/server.cpp",
    "src/rrr/rpc/utils.cpp",
    "src/rrr/reactor/epoll_wrapper.cc",
    "src/rrr/reactor/event.cc",
    "src/rrr/reactor/fiber_impl.cc",
    "src/rrr/reactor/quorum_event.cc",
    "src/rrr/reactor/reactor.cc",
]
includes = [
    "src/rrr",
    "src/rrr/base",
    "src/rrr/misc",
    "src/rrr/rpc",
    "src/rrr/reactor",
]
libs = ["pthread"]

[[target]]
name = "libmako_core"
type = "static_library"
sources = [
    "src/mako/allocator.cc",
    "src/mako/btree.cc",
    "src/mako/core.cc",
    "src/mako/counter.cc",
    "src/mako/db.cc",
    # "src/mako/disk.cpp",  # Excluded: contains test main()
    "src/mako/memory.cc",
    "src/mako/rcu.cc",
    "src/mako/silo_runtime.cc",
    "src/mako/ticker.cc",
    "src/mako/tuple.cc",
    "src/mako/varint.cc",
    # Masstree sources
    "src/mako/masstree/compiler.cc",
    "src/mako/masstree/str.cc",
    "src/mako/masstree/string.cc",
    "src/mako/masstree/straccum.cc",
    "src/mako/masstree/json.cc",
    "src/mako/masstree/kvthread.cc",
    "src/mako/masstree/masstree_context.cc",
]
includes = [
    "src/mako",
    # Note: NOT including "src/mako/lib" here to avoid assert.h conflict
    # If libmako_core sources need lib headers, include as "lib/foo.h"
]
deps = ["librrr"]

[[target]]
name = "libmako_lib"
type = "static_library"
sources = [
    "src/mako/lib/configuration.cc",
    "src/mako/lib/memory.cc",
    "src/mako/lib/message.cc",
    "src/mako/lib/promise.cc",
    "src/mako/lib/timestamp.cc",
    "src/mako/lib/transport.cc",
]
includes = [
    # Note: Use "src/mako" NOT "src/mako/lib" to avoid shadowing system <assert.h>
    # Source files include as "lib/assert.h" which resolves correctly from src/mako
    ".",
    "src",
    "src/mako",
    "third-party/rusty-cpp/include",
    # NOT including third-party/erpc/src - lib sources use stub rpc.h instead
]
# Don't inherit global includes - this avoids pulling in full eRPC headers
# which the core lib sources don't need (they only use minimal rpc.h types)
inherit_includes = false
deps = ["libmako_core"]

