# Three Rust workers contend on one committed counter. Exit automatically with:
# build/mako_transactions --config examples/native/transactions.yml --exit-after-run
node:
  owner: 0
  nodes: 1
  listen: 127.0.0.1:31000
  workers: 3
  warehouses_per_shard: 1
  tables:
    - {id: 1, name: records, kind: governed, warehouse: true, initial_owner: 0}
transactions:
  rounds_per_worker: 100
  timeout_seconds: 120
