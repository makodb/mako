# Start with: mako_node --config examples/native/masstree-node.yml
owner: 0
nodes: 1
listen: 127.0.0.1:7810
workers: 4
gateway_workers: 4
# To switch an existing node, change masstree and set create to false.
engine:
  kind: rocksdb
  directory: ./data/shared-node/data
  masstree: true
persistence:
  directory: ./data/shared-node
  create: true
  sync_writes: true
tables:
  - id: 1
    name: rows
    kind: governed
    warehouse: false
    initial_owner: 0
