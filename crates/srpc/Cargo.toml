[package]
name = "srpc"
version = "0.1.0"
edition = "2021"
description = "sRPC: the rrr RPC framework as a real Rust library (wire-compatible port of src/rrr)"
license = "MIT"

# Transpiler-first policy: NO external dependencies. Every dependency
# would itself need to survive rusty-cpp's Rust->C++ transpilation for
# the C++ (mako) consumption path. Platform kernels (epoll, sockets,
# context switch) will use `libc` only, added when the transport port
# begins; the wire layer is pure safe Rust.
[dependencies]

[lints.rust]
unsafe_code = "deny"
