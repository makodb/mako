[package]
name = "rocksdb-raft-service"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
test-hooks = ["sto-rocksdb/test-hooks", "raft-host/test-hooks"]

[dependencies]
sto-rocksdb = { path = "../sto-rocksdb", default-features = false }
raft-host = { path = "../raft-host" }
mrx-rocks = { path = "../mrx-rocks", default-features = false }
mrx-core = { path = "../mrx-core", default-features = false }
mako-sharding = { path = "../../src/cluster", default-features = false }
srpc = { path = "../../src/srpc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"

[[bin]]
name = "rocksdb_raft_server"
path = "src/bin/server.rs"

[[bin]]
name = "rocksdb_raft_client"
path = "src/bin/client.rs"

[[bin]]
name = "rocksdb_raft_bench"
path = "src/bin/bench.rs"
