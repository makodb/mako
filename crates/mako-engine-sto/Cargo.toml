[package]
name = "mako-engine-sto"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Mako's local engine contract implemented over the native Rust STO (sto-core, sto-masstree, mako-clock)"

[features]
# Test-only commit observer, simulated cleanup failures, and the pinned
# physical clock. Never enable in production.
test-hooks = ["mako-clock/test-hooks"]

[dependencies]
mako-clock = { path = "../mako-clock" }
mako-engine-api = { path = "../mako-engine-api" }
masstree = { path = "../masstree" }
sto-core = { path = "../sto-core" }
sto-masstree = { path = "../sto-masstree" }

[dev-dependencies]
mako-differential = { path = "../mako-differential" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
