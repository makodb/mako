# shard-host-core: the decisions of the sharding storage host on the Rust
# engine that Verus checks. sto-tpcc-ffi's shard_host.rs is the shell around
# it: it owns the FFI, the raw pointers, the thread-locals, the panic
# containment and the calls into the engine, and it calls in here for every
# decision this crate holds.
#
# Verified by scripts/verify_shard_host_core.sh with the pinned Verus release.
# Under plain cargo the verus! macro erases the ghost code, and what is left
# is the exec code the shell links.
[package]
name = "shard-host-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# Verus's macro and library crates at the version this workspace already
# locks for raft-core. scripts/verify_shard_host_core.sh checks that their
# sources are the ones the pinned Verus release carries.
vstd = "=0.0.0-2026-08-02-0125"
verus_builtin = "=0.0.0-2026-08-02-0125"
verus_builtin_macros = "=0.0.0-2026-08-02-0125"

[lints.rust]
# Verus sets these when it verifies.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)', 'cfg(verus_keep_ghost_body)'] }
