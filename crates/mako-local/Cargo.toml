[package]
name = "mako-local"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "Safe Rust transactions over Mako's C++ STO/MassTrans engine"
license = "MIT"
publish = false

[dependencies]
mako-engine-api = { path = "../mako-engine-api" }
mako-local-sys = { path = "../mako-local-sys" }

[dev-dependencies]
mako-clock = { path = "../mako-clock", features = ["test-hooks"] }
mako-differential = { path = "../mako-differential" }
mako-history = { path = "../mako-history" }
