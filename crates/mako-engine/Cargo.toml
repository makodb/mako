[package]
name = "mako-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Compile-time selected local transaction engine behind the mako-engine-api contract"

[features]
default = ["sto"]
sto = []
sto-test-hooks = ["mako-engine-sto/test-hooks"]

[dependencies]
mako-engine-api = { path = "../mako-engine-api" }
mako-engine-sto = { path = "../mako-engine-sto" }
