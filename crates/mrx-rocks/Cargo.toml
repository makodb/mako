[package]
name = "mrx-rocks"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "Blobs over RocksDB, through its stable C API"
license = "MIT"
publish = false

[features]
default = []
# Synchronous wrapper-level write observers for deterministic crash tests.
# This does not expose a hook inside RocksDB's WAL implementation.
test-hooks = []

[dependencies]
mrx-core = { path = "../mrx-core" }
# See crates/Cargo.toml: profiles live at the workspace root.
