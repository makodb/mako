[package]
name = "mako-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
native-storage = ["dep:sto-tpcc-ffi"]

[dependencies]
sto-tpcc-ffi = { path = "../sto-tpcc-ffi", optional = true }
mako-sharding = { path = "../../src/cluster" }
srpc = { path = "../../src/srpc" }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
parking_lot = "0.12"
serde_json = "1"
libc = "0.2"

[[bin]]
name = "mako_node"
path = "src/bin/node.rs"
required-features = ["native-storage"]

