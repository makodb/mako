[package]
name = "mako-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-hooks = ["mako-sharding/test-hooks", "sto-rocksdb?/test-hooks"]
default = []
runtime-storage = ["dep:serde-saphyr"]
masstree-engine = ["runtime-storage", "dep:mako-storage-masstree"]
rocksdb-engine = ["runtime-storage", "dep:mako-storage-rocksdb"]
native-storage = ["masstree-engine"]
durable-storage = ["dep:sto-rocksdb", "dep:sha2"]
logging = ["runtime-storage", "durable-storage", "dep:raft-host", "dep:mako-storage-rocksdb"]
# Compatibility profile for existing Masstree build commands.
replication = ["native-storage", "logging"]

[dependencies]
shard-host-core = { path = "../shard-host-core" }
mako-storage-rocksdb = { path = "../mako-storage-rocksdb", optional = true }
mako-storage-api = { path = "../mako-storage-api" }
mako-storage-masstree = { path = "../mako-storage-masstree", optional = true }
mako-protocol = { path = "../mako-protocol" }
mako-protocol-core = { path = "../mako-protocol-core" }
mako-sharding = { path = "../../src/cluster" }
srpc = { path = "../../src/srpc" }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
parking_lot = "0.12"
serde_json = "1"
serde-saphyr = { version = "2.2", default-features = false, features = ["deserialize"], optional = true }
libc = "0.2"
mako-clock = { path = "../mako-clock" }
sto-rocksdb = { path = "../sto-rocksdb", optional = true }
sha2 = { version = "0.10", optional = true }
raft-host = { path = "../raft-host", optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "mako_admin"
path = "src/bin/admin.rs"

[[bin]]
name = "mako_redis"
path = "src/bin/redis.rs"
required-features = ["runtime-storage"]

[[bin]]
name = "mako_client"
path = "src/bin/client.rs"

[[bin]]
name = "mako_node"
path = "src/bin/node.rs"
required-features = ["runtime-storage"]

[[bin]]
name = "mako_transactions"
path = "src/bin/transactions.rs"
required-features = ["runtime-storage"]

[[bin]]
name = "mako_bench"
path = "src/bin/bench.rs"
required-features = ["runtime-storage"]


[[bin]]
name = "mako_convert"
path = "src/bin/convert.rs"
required-features = ["logging"]
