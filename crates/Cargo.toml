# Workspace for Mako's native Rust components: the Masstree/RocksDB cache
# (mrx-*, mako-cache), the native Rust STO (sto-*), and the direct
# RocksDB/Raft profile (sto-rocksdb, raft-host, rocksdb-raft-service; built
# and tested by cmake/RocksdbRaft.cmake, not by the workspace-wide sweeps).
#
# One workspace so the crates share a lockfile and a target directory, and
# so `cargo test` at this level covers all of them. It is rooted at
# `crates/` rather than the repository root deliberately: the repository
# root is a CMake project, and putting a Cargo.toml there would make every
# unrelated Rust artefact in the tree (rust-lib, third-party) a member by
# accident.
[workspace]
resolver = "2"
members = [
    "mako-cache",
    "mako-cache-bench",
    "mako-clock",
    "mako-differential",
    "mako-engine",
    "mako-engine-api",
    "mako-engine-sto",
    "mako-history",
    "mako-runtime",
    "mako-protocol",
    "mako-protocol-core",
    "mako-storage-api",
    "mako-storage-masstree",
    "mako-storage-rocksdb",
    "masstree",
    "mrx",
    "mrx-ffi",
    "mrx-core",
    "mrx-masstree",
    "mrx-rocks",
    "mtree-sys",
    "mtx-sys",
    "raft-host",
    "rocksdb-raft-service",
    "shard-host-core",
    "sto-core",
    "sto-masstree",
    "sto-rocksdb",
    "sto-test-datatypes",
    "sto-tpcc-ffi",
]

[workspace.package]
edition = "2021"
rust-version = "1.95"
license = "MIT"
publish = false

# See mrx-core: mixing an LTO staticlib with the existing non-LTO rust-lib
# archive fails to link with duplicate std symbols. Reproduced, not
# theorised.
[profile.release]
lto = false
panic = "abort"
codegen-units = 1
opt-level = 3

[profile.dev]
lto = false

# raft-host and rocksdb-raft-service depend on srpc (whose Lion runtime names
# vstd from Verus's git repository), on raft-core (Verus's crates.io release)
# and on src/cluster (another git revision). Cargo refuses two Verus releases
# in one graph, so unify them exactly as src/deptran/raft/Cargo.toml does.
# Standalone sharding verification retains its own pinned verifier dependency.
#
# The entry is a table, not the bare version string src/deptran/raft/Cargo.toml
# uses: trybuild (sto-core's compile-fail test) reads this manifest with its
# own parser, which accepts only tables under [patch]. On a string it silently
# falls back to an empty workspace manifest and then fails every case with
# "no edition found in workspace's manifest".
[patch."https://github.com/verus-lang/verus"]
vstd = { version = "=0.0.0-2026-08-02-0125" }
