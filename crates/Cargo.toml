# Rust workspace for distributed transactions, storage adapters and component tests.
[workspace]
resolver = "2"
members = [
    "mako-history",
    "mako-runtime",
    "mako-workloads",
    "mako-rocksdb",
    "mako-storage-api",
    "mako-storage-masstree",
    "mako-storage-rocksdb",
    "masstree",
    "mako-rocksdb-store",
    "mtree-sys",
    "raft-host",
    "shard-host-core",
    "sto-core",
    "sto-masstree",
    "sto-rocksdb",
    "sto-test-datatypes",
    "sto-masstree-api",
]

[workspace.package]
edition = "2021"
rust-version = "1.95"
license = "MIT"
publish = false

# Native static archives share the same non-LTO Rust linkage.
[profile.release]
lto = false
panic = "abort"
codegen-units = 1
opt-level = 3

[profile.dev]
lto = false

# raft-host depends on srpc (whose Lion runtime names
# vstd from Verus's git repository), on raft-core (Verus's crates.io release)
# and on src/cluster (another git revision). Cargo refuses two Verus releases
# in one graph, so unify them exactly as src/deptran/raft/Cargo.toml does.
# Standalone sharding verification retains its own pinned verifier dependency.
#
# The entry is a table, not the bare version string src/deptran/raft/Cargo.toml
# uses: trybuild (sto-core's compile-fail test) reads this manifest with its
# own parser, which accepts only tables under [patch]. On a string it silently
# falls back to an empty workspace manifest and then fails every case with
# "no edition found in workspace's manifest".
[patch."https://github.com/verus-lang/verus"]
vstd = { version = "=0.0.0-2026-08-02-0125" }
