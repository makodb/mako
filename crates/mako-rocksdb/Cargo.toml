[package]
name = "mako-rocksdb"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = []
rocksdb-engine = ["dep:mako-runtime", "dep:mako-storage-api", "dep:serde_json", "mako-runtime/rocksdb-engine", "mako-runtime/logging"]
masstree-engine = ["rocksdb-engine", "mako-runtime/masstree-engine"]
# Upstream file-format fixtures belong only to concrete integration tests.
native-fixtures = ["rocksdb-engine", "dep:rocksdb"]

[dependencies]
sto-core = { path = "../sto-core", features = ["protocol"] }
mako-runtime = { path = "../mako-runtime", optional = true }
mako-storage-api = { path = "../mako-storage-api", optional = true }
serde_json = { version = "1", optional = true }
rocksdb = { version = "=0.25.0", optional = true }

[dev-dependencies]
mako-sharding = { path = "../../src/cluster", default-features = false, features = ["protocol"] }

[[test]]
name = "native"
required-features = ["native-fixtures"]

[[example]]
name = "rocksdb_transactions"
required-features = ["rocksdb-engine"]
