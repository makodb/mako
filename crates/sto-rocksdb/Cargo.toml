[package]
name = "sto-rocksdb"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false

[features]
default = []
test-hooks = []

[dependencies]
sto-core = { path = "../sto-core", default-features = false }
mrx-core = { path = "../mrx-core", default-features = false }
mrx-rocks = { path = "../mrx-rocks", default-features = false, features = ["required-native"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
