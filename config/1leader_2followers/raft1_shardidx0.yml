site:
  # each line is a partition (Raft group), first 3 sites are replicas (no learner in Raft)
  # Use ports 27xxx to avoid conflicts with common services (8xxx range often used)
  server:
    - ["s101:27001", "s201:27101", "s301:27201"]

# s101: localhost
# s201: p1
# s301: p2
process:
  s101: localhost
  s201: p1
  s301: p2

# process_name - host_addr map
host:
  localhost: 127.0.0.1
  p1: 127.0.0.1
  p2: 127.0.0.1
