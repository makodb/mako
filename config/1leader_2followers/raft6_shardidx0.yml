site:
  # each line is a partition (Raft group), first 3 sites are replicas (no learner in Raft)
  # Use ports 55xxx to avoid conflicts with common services (8xxx range often used)
  server:
    - ["s101:55001", "s201:55101", "s301:55201"]
    - ["s102:55002", "s202:55102", "s302:55202"]
    - ["s103:55003", "s203:55103", "s303:55203"]
    - ["s104:55004", "s204:55104", "s304:55204"]
    - ["s105:55005", "s205:55105", "s305:55205"]
    - ["s106:55006", "s206:55106", "s306:55206"]

# s101: localhost
# s201: p1
# s301: p2
process:
  s101: localhost
  s201: p1
  s301: p2
  s102: localhost
  s202: p1
  s302: p2
  s103: localhost
  s203: p1
  s303: p2
  s104: localhost
  s204: p1
  s304: p2
  s105: localhost
  s205: p1
  s305: p2
  s106: localhost
  s206: p1
  s306: p2

# process_name - host_addr map
host:
  localhost: 127.0.0.1
  p1: 127.0.0.1
  p2: 127.0.0.1
