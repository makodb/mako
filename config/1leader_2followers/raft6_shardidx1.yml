site:
  # each line is a partition (Raft group), first 3 sites are replicas (no learner in Raft)
  # Use ports 28xxx to avoid conflicts with common services (8xxx range often used)
  server:
    - ["s101:28001", "s201:28101", "s301:28201"]
    - ["s102:28002", "s202:28102", "s302:28202"]
    - ["s103:28003", "s203:28103", "s303:28203"]
    - ["s104:28004", "s204:28104", "s304:28204"]
    - ["s105:28005", "s205:28105", "s305:28205"]
    - ["s106:28006", "s206:28106", "s306:28206"]

# s101: localhost
# s201: p1
# s301: p2
process:
  s101: localhost
  s201: p1
  s301: p2
  s102: localhost
  s202: p1
  s302: p2
  s103: localhost
  s203: p1
  s303: p2
  s104: localhost
  s204: p1
  s304: p2
  s105: localhost
  s205: p1
  s305: p2
  s106: localhost
  s206: p1
  s306: p2

# process_name - host_addr map
host:
  localhost: 127.0.0.1
  p1: 127.0.0.1
  p2: 127.0.0.1
