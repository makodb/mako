site:
  # each line is a partition (Raft group), first 3 sites are replicas (no learner in Raft)
  # Use ports 56xxx to avoid conflicts with common services (8xxx range often used)
  server:
    - ["s101:56001", "s201:56101", "s301:56201"]
    - ["s102:56002", "s202:56102", "s302:56202"]
    - ["s103:56003", "s203:56103", "s303:56203"]
    - ["s104:56004", "s204:56104", "s304:56204"]
    - ["s105:56005", "s205:56105", "s305:56205"]
    - ["s106:56006", "s206:56106", "s306:56206"]

# s101: localhost
# s201: p1
# s301: p2
process:
  s101: localhost
  s201: p1
  s301: p2
  s102: localhost
  s202: p1
  s302: p2
  s103: localhost
  s203: p1
  s303: p2
  s104: localhost
  s204: p1
  s304: p2
  s105: localhost
  s205: p1
  s305: p2
  s106: localhost
  s206: p1
  s306: p2

# process_name - host_addr map
host:
  localhost: 127.0.0.1
  p1: 127.0.0.1
  p2: 127.0.0.1
