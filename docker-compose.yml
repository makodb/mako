version: '3.8'

services:
  ubuntu22-build:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.ubuntu22
    image: mako-build:ubuntu22
    container_name: mako-ubuntu22
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      # Use separate Cargo target directory to avoid conflicts with host builds
      # This location is shared by all Rust dependencies (rusty-cpp, rust-lib, etc.)
      - CARGO_TARGET_DIR=/workspace/target-docker
    command: /bin/bash -c "cd /workspace && rm -rf build && mkdir -p build && cd build && cmake .. && make -j $(nproc) dbtest"
    
  ubuntu22-dev:
    platform: linux/amd64
    image: mako-build:ubuntu22
    container_name: mako-ubuntu22-dev
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      # Use separate Cargo target directory to avoid conflicts with host builds
      # This location is shared by all Rust dependencies (rusty-cpp, rust-lib, etc.)
      - CARGO_TARGET_DIR=/workspace/target-docker
    stdin_open: true
    tty: true
    command: /bin/bash