[package]
name = "mako-cache-bench"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
publish = false
build = "build.rs"

[workspace]
resolver = "2"

[profile.release]
lto = "thin"
panic = "abort"
codegen-units = 1
opt-level = 3

[features]
default = ["engine-c-abi"]
engine-c-abi = ["mako-cache/engine-c-abi", "mako-engine/c-abi"]
engine-sto = ["mako-cache/engine-sto", "mako-engine/sto"]
allocation-profile = []

[dependencies]
mako-cache = { path = "/home/users/shuai/mako/.claude/worktrees/masstree-rocks/crates/mako-cache", default-features = false }
mako-engine = { path = "/home/users/shuai/mako/.claude/worktrees/masstree-rocks/crates/mako-engine", default-features = false }
mrx = { path = "/home/users/shuai/mako/.claude/worktrees/masstree-rocks/crates/mrx" }
mrx-core = { path = "/home/users/shuai/mako/.claude/worktrees/masstree-rocks/crates/mrx-core" }
mrx-rocks = { path = "/home/users/shuai/mako/.claude/worktrees/masstree-rocks/crates/mrx-rocks" }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.30.1", default-features = false, features = ["time"] }

